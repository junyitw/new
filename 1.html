<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>均一學校排課與匯出系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (用於在瀏覽器端編譯 TSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f9fafb;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        @media print {
            aside, button, .no-print {
                display: none !important;
            }
            main {
                padding: 0 !important;
                height: auto !important;
                overflow: visible !important;
            }
            .bg-white {
                border: none !important;
                box-shadow: none !important;
            }
            .overflow-x-auto {
                overflow: visible !important;
            }
            h1, h2 {
                color: black !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript" data-type="module">
        import { GoogleGenAI, Type } from "https://esm.sh/@google/genai";

        // 防止前端存取 process.env 報錯
        window.process = {
            env: {
                API_KEY: '請在此填入您的_GEMINI_API_KEY'
            }
        };

        const { useState, useMemo, useRef, useEffect } = React;

        /* ==========================================
           TYPES (補齊缺少的 types.ts)
           ========================================== */
        type DayOfWeek = 'Mon' | 'Tue' | 'Wed' | 'Thu' | 'Fri';
        type ViewMode = 'Master' | 'Class' | 'Teacher' | 'Room' | 'Conflict' | 'TeacherAdmin' | 'RoomAdmin';
        
        interface TimeSlot {
            id: number;
            label: string;
            time: string;
            type: 'class' | 'break' | 'event';
        }

        interface Lesson {
            id: string;
            classId: string;
            day: DayOfWeek;
            periodId: number;
            subject: string;
            teacher: string;
            room?: string;
            color: string;
            isLocked?: boolean;
            isDouble?: boolean;
        }

        interface Assignment {
            subject: string;
            classId: string;
            sessions: number;
            isDouble?: boolean;
        }

        interface Conflict {
            type: 'Teacher' | 'Room' | 'Class' | 'Mask';
            name: string;
            day: DayOfWeek;
            periodId: number;
            lessonIds: string[];
        }

        interface ColorOption {
            label: string;
            value: string;
        }

        /* ==========================================
           CONSTANTS (constants.ts)
           ========================================== */
        const DAYS: DayOfWeek[] = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

        const TIME_SLOTS: TimeSlot[] = [
            { id: 0, label: 'Morning', time: '07:50-08:00', type: 'event' },
            { id: 1, label: '1', time: '08:00-09:00', type: 'class' },
            { id: 2, label: '2', time: '09:00-10:00', type: 'class' },
            { id: 10, label: 'Recess', time: '10:00-10:30', type: 'break' },
            { id: 3, label: '3', time: '10:30-11:10', type: 'class' },
            { id: 4, label: '4', time: '11:20-12:00', type: 'class' },
            { id: 11, label: 'Lunch', time: '12:05-12:30', type: 'break' },
            { id: 12, label: 'Quiet', time: '12:30-13:20', type: 'break' },
            { id: 5, label: '5', time: '13:20-14:00', type: 'class' },
            { id: 6, label: '6', time: '14:10-14:50', type: 'class' },
            { id: 7, label: '7', time: '14:50-15:30', type: 'class' },
        ];

        const COLOR_OPTIONS: ColorOption[] = [
            { label: '主課程', value: 'bg-blue-100 border-blue-200' },
            { label: '英文', value: 'bg-purple-100 border-purple-200' },
            { label: '藝術', value: 'bg-orange-100 border-orange-200' },
            { label: '活動', value: 'bg-yellow-100 border-yellow-200' },
            { label: '練習', value: 'bg-green-100 border-green-200' },
            { label: '晨圈', value: 'bg-pink-100 border-pink-200' },
        ];

        const INITIAL_LESSONS: Lesson[] = [];
        const STATIC_TEACHERS: string[] = [];
        const CLASSES = ['101', '201', '301', '401', '501', '601'];
        const INITIAL_ROOMS = ['圖書館', '音樂教室', '手工教室', '泥塑教室', '美術教室', '活動中心'];

        function isClassSlotAvailable(classId: string, day: DayOfWeek, periodId: number): { available: boolean; reason?: string } {
            if (periodId < 1 || periodId > 7) {
                return { available: false, reason: '非課程時段' };
            }
            if (periodId === 7) {
                return { available: false, reason: '第7節全校不排課' };
            }
            if (day === 'Wed' && periodId > 4) {
                return { available: false, reason: '週三下午全校不排課' };
            }
            if (classId === '101' && periodId > 4) {
                return { available: false, reason: '一年級下午放學' };
            }
            if (classId === '201') {
                if ((day === 'Mon' || day === 'Wed' || day === 'Fri') && periodId > 4) {
                    return { available: false, reason: '二年級週一三五下午放學' };
                }
            }
            return { available: true };
        }

        function getDoublePeriodPartner(periodId: number): number | null {
            switch (periodId) {
                case 1: return 2;
                case 2: return 1;
                case 3: return 4;
                case 4: return 3;
                case 5: return 6;
                case 6: return 5;
                default: return null;
            }
        }

        /* ==========================================
           MOCKS (補齊缺少的 conflictResolver.ts)
           ========================================== */
        // 以下為為了讓介面不報錯的預設空實作。請替換為您真實的程式碼。
        const findAllConflicts = (lessons: Lesson[]): Conflict[] => [];
        const resolveAllConflicts = (lessons: Lesson[], assignments: any, rooms: any, aiPrompt?: string) => ({ resolvedLessons: lessons, resolvedCount: 0, remainingConflicts: [] });
        const validateDoublePeriods = (lessons: Lesson[], assignments?: any) => lessons;
        const generateDeterministicSchedule = (classes: any, remainingAssignments: any, lockedLessons: any, rooms: any, aiPrompt: string) => [];
        const enforceSchedulingPreferences = (lessons: Lesson[], aiPrompt: string, assignments: any, rooms: any) => lessons;
        const pruneOverAssignments = (lessons: Lesson[], assignments: any, lockedLessons: any) => lessons;
        const isSameSubject = (subj1: string, subj2: string, classId?: string) => subj1 === subj2;


        /* ==========================================
           COMPONENTS
           ========================================== */
           
        // --- TimetableCell.tsx ---
        const TimetableCell: React.FC<any> = ({ 
            lesson, type, label, onClick, onCopy, onToggleLock, onDragStart, onDragOver, onDrop, isStamping, isConflicting, isDisabled, disabledReason
        }) => {
            if (type === 'break' || type === 'event') {
                return (
                <div className="h-full w-full flex items-center justify-center bg-gray-50 text-gray-500 text-[10px] font-bold border-b border-r border-gray-200 uppercase tracking-tighter">
                    {label}
                </div>
                );
            }

            if (isDisabled) {
                return (
                <div 
                    className="h-full w-full p-2 flex flex-col items-center justify-center text-center border-b border-r border-gray-200 min-h-[85px] bg-gray-100/70 select-none cursor-not-allowed group relative"
                    title={disabledReason ? `【遮罩禁排】${disabledReason}` : '此時段不排課'}
                >
                    <div className="absolute inset-0 bg-[repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6_10px,#e5e7eb_10px,#e5e7eb_20px)] opacity-60"></div>
                    <div className="relative z-10 flex flex-col items-center justify-center px-1">
                    <span className="text-[11px] font-bold text-gray-400 flex items-center gap-1">
                        <span className="text-xs">🚫</span>
                        <span className="truncate max-w-[85px]">{disabledReason || '禁排時段'}</span>
                    </span>
                    </div>
                </div>
                );
            }

            const isDouble = lesson?.isDouble;

            return (
                <div 
                onClick={onClick}
                draggable={!!lesson && !isStamping && !lesson.isLocked}
                onDragStart={onDragStart}
                onDragOver={onDragOver}
                onDrop={onDrop}
                className={`h-full w-full p-2 flex flex-col items-center justify-center text-center cursor-pointer transition-all border-b border-r border-gray-200 min-h-[85px] relative group ${
                    lesson ? `${lesson.color} shadow-sm active:scale-95 active:opacity-50` : 'hover:bg-indigo-50/50'
                } ${isStamping ? 'hover:ring-4 hover:ring-indigo-400 hover:ring-inset' : ''} ${lesson?.isLocked ? 'ring-2 ring-amber-400/50' : ''} ${isConflicting ? 'ring-2 ring-red-500 ring-offset-2 animate-pulse !bg-red-50 !border-red-500' : ''}`}
                >
                {lesson ? (
                    <>
                    {isConflicting && (
                        <div className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow z-20" title="衝堂警告">
                        <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        </div>
                    )}
                    <div className="flex items-center gap-1 flex-wrap justify-center">
                        {lesson.isLocked && <span className="inline-block text-xs" title="已鎖定 (無法拖拉)">🔒</span>}
                        {isDouble && (
                        <span className="px-1 py-0.2 bg-indigo-600 text-white text-[8px] font-black rounded tracking-tighter" title="連堂課 (雙節成對)">
                            🔗連堂
                        </span>
                        )}
                        <span className="text-sm font-black text-gray-800 leading-tight">
                        {lesson.subject}
                        </span>
                    </div>
                    <span className="text-[10px] text-gray-600 mt-1 font-bold">{lesson.teacher}</span>
                    {lesson.room && (
                        <span className="text-[9px] text-gray-500/80 mt-0.5 font-medium">📍{lesson.room}</span>
                    )}
                    
                    <div className="absolute top-1 right-1 flex space-x-1 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                        {!isStamping && onToggleLock && (
                        <button 
                            onClick={(e) => { e.stopPropagation(); onToggleLock(e); }}
                            className={`bg-white/80 hover:bg-white p-1 rounded-md shadow-sm border ${lesson.isLocked ? 'text-amber-500 border-amber-200' : 'text-gray-400 border-gray-200'}`}
                            title={lesson.isLocked ? '解除鎖定' : '鎖定此課'}
                        >
                            {lesson.isLocked ? '🔓' : '🔒'}
                        </button>
                        )}
                        {!isStamping && onCopy && !lesson.isLocked && (
                        <button 
                            onClick={(e) => { e.stopPropagation(); onCopy(e); }}
                            className="bg-white/80 hover:bg-white text-indigo-600 p-1 rounded-md shadow-sm border border-indigo-100"
                            title="複製"
                        >
                            📋
                        </button>
                        )}
                    </div>
                    </>
                ) : (
                    <span className="text-indigo-200 text-lg font-black opacity-0 group-hover:opacity-100 transition-opacity">
                    +
                    </span>
                )}
                </div>
            );
        };

        // --- TimetableGrid.tsx ---
        const TimetableGrid: React.FC<any> = ({ 
            lessons, title, subtitle, onCellClick, onMoveLesson, onCopyLesson, onToggleLock, isStampMode, currentClassId, conflictingLessonIds = new Set()
        }) => {
            const handleDragStart = (e: React.DragEvent, lessonId: string) => {
                e.dataTransfer.setData('lessonId', lessonId);
            };
            const handleDragOver = (e: React.DragEvent) => { e.preventDefault(); };
            const handleDrop = (e: React.DragEvent, day: DayOfWeek, periodId: number) => {
                e.preventDefault();
                const sourceId = e.dataTransfer.getData('lessonId');
                if (sourceId && currentClassId) {
                onMoveLesson(sourceId, day, periodId, currentClassId);
                }
            };

            return (
                <div className="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100 animate-in fade-in slide-in-from-bottom-4 duration-700">
                <div className="p-8 bg-gray-900 text-white flex justify-between items-center">
                    <div>
                    <h2 className="text-2xl font-black tracking-tight">{title}</h2>
                    {subtitle && <p className="text-gray-400 text-sm mt-1 font-medium">{subtitle}</p>}
                    {isStampMode && <p className="text-indigo-400 text-xs font-black mt-2 no-print">✨ 印章模式：點擊下方空格快速蓋章</p>}
                    </div>
                </div>

                <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full border-collapse table-fixed min-w-[800px]">
                    <thead>
                        <tr className="bg-gray-50">
                        <th className="w-24 p-4 border-b border-r border-gray-200 text-[10px] font-black text-gray-400 uppercase tracking-widest">時間節次</th>
                        {DAYS.map(day => <th key={day} className="p-4 border-b border-r border-gray-200 text-sm font-black text-gray-700 uppercase">{day}</th>)}
                        </tr>
                    </thead>
                    <tbody>
                        {TIME_SLOTS.map(slot => (
                        <tr key={slot.id} className="group hover:bg-gray-50/30 transition-colors">
                            <td className="p-3 border-b border-r border-gray-100 bg-white text-center">
                            <div className="text-xs font-black text-gray-800">{slot.label}</div>
                            <div className="text-[10px] text-gray-400 mt-0.5 font-mono">{slot.time}</div>
                            </td>
                            {DAYS.map(day => {
                            const lesson = lessons.find(l => l.day === day && l.periodId === slot.id);
                            const slotStatus = currentClassId && slot.type === 'class' ? isClassSlotAvailable(currentClassId, day, slot.id) : null;
                            const isSlotDisabled = slotStatus ? !slotStatus.available : (slot.type === 'class' && slot.id === 7);
                            const disabledReason = slotStatus?.reason || (slot.id === 7 ? '第7節全校不排課' : undefined);

                            return (
                                <td key={`${day}-${slot.id}`} className="p-0">
                                <TimetableCell 
                                    lesson={lesson} 
                                    type={slot.type} 
                                    isStamping={isStampMode}
                                    isConflicting={lesson ? conflictingLessonIds.has(lesson.id) : false}
                                    isDisabled={isSlotDisabled}
                                    disabledReason={disabledReason}
                                    label={slot.type !== 'class' ? slot.label : undefined}
                                    onClick={() => !isSlotDisabled && slot.type === 'class' && onCellClick?.(day, slot.id)}
                                    onCopy={() => lesson && onCopyLesson?.(lesson)}
                                    onToggleLock={() => lesson && onToggleLock?.(lesson)}
                                    onDragStart={(e) => lesson && handleDragStart(e, lesson.id)}
                                    onDragOver={handleDragOver}
                                    onDrop={(e) => !isSlotDisabled && slot.type === 'class' && handleDrop(e, day, slot.id)}
                                />
                                </td>
                            );
                            })}
                        </tr>
                        ))}
                    </tbody>
                    </table>
                </div>
                </div>
            );
        };

        // --- MasterMatrix.tsx ---
        const MasterMatrix: React.FC<any> = ({ 
            lessons, onCellClick, onMoveLesson, onCopyLesson, onToggleLock, onLockAll, onUnlockAll, onClearAll, isStampMode, conflictingLessonIds = new Set(), onAutoResolve, conflictCount = 0
        }) => {
            const [confirmStep, setConfirmStep] = useState(0);
            useEffect(() => {
                if (confirmStep === 1) {
                const timer = setTimeout(() => setConfirmStep(0), 3000);
                return () => clearTimeout(timer);
                }
            }, [confirmStep]);

            const handleDragStart = (e: React.DragEvent, lessonId: string) => { e.dataTransfer.setData('lessonId', lessonId); };
            const handleDragOver = (e: React.DragEvent) => { e.preventDefault(); };
            const handleDrop = (e: React.DragEvent, day: DayOfWeek, periodId: number, classId: string) => {
                e.preventDefault();
                const sourceId = e.dataTransfer.getData('lessonId');
                if (sourceId) onMoveLesson(sourceId, day, periodId, classId);
            };

            const handleClear = () => {
                if (confirmStep === 0) setConfirmStep(1);
                else { onClearAll(); setConfirmStep(0); }
            };

            return (
                <div className="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100 animate-in fade-in zoom-in-95 duration-500">
                <div className="p-8 bg-indigo-900 text-white flex justify-between items-center">
                    <div>
                    <h2 className="text-2xl font-black tracking-tight">全校大課表 (Master Schedule)</h2>
                    <div className="flex items-center gap-2 mt-1">
                        <span className="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 rounded-full text-[10px] font-black">🛡️ 班級作息遮罩已啟用</span>
                        <p className="text-indigo-300 text-xs font-medium">{isStampMode ? '✨ 印章模式已啟用' : '💡 提示：按住課程可拖拽調課，點擊 📋 可複製'}</p>
                    </div>
                    </div>
                    <div className="flex gap-3 items-center">
                    {conflictCount > 0 && onAutoResolve && (
                        <button onClick={onAutoResolve} className="px-4 py-2 rounded-xl text-xs font-black bg-gradient-to-r from-red-500 to-amber-500 text-white shadow-md hover:scale-105 active:scale-95 transition-all flex items-center gap-1.5 no-print"><span>⚡</span><span>消除衝堂 ({conflictCount})</span></button>
                    )}
                    {onLockAll && <button onClick={onLockAll} className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-800/80 hover:bg-indigo-700 transition-colors border border-indigo-700/50 flex items-center gap-2 no-print">🔒 全部鎖定</button>}
                    {onUnlockAll && <button onClick={onUnlockAll} className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-800/80 hover:bg-indigo-700 transition-colors border border-indigo-700/50 flex items-center gap-2 no-print">🔓 全部解鎖</button>}
                    <button onClick={handleClear} className={`px-5 py-2.5 rounded-xl text-xs font-black shadow-lg transition-all flex items-center gap-2 group active:scale-95 no-print ${confirmStep === 1 ? 'bg-amber-500 hover:bg-amber-600 animate-pulse ring-4 ring-amber-500/30' : 'bg-red-500 hover:bg-red-600'}`}>{confirmStep === 1 ? '確認清空未鎖定？' : '清空未鎖定課程'}</button>
                    </div>
                </div>

                <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full border-collapse border-spacing-0">
                    <thead>
                        <tr className="bg-gray-50">
                        <th className="sticky left-0 z-30 bg-gray-50 w-24 p-4 border-b border-r border-gray-200 text-[10px] font-black text-gray-400 uppercase tracking-widest">節次 / 班級</th>
                        {CLASSES.map(cls => <th key={cls} className="p-4 border-b border-r border-gray-200 text-sm font-black text-gray-800 bg-gray-50/80">{cls} 班</th>)}
                        </tr>
                    </thead>
                    <tbody>
                        {DAYS.map(day => (
                        <React.Fragment key={day}>
                            <tr className="bg-indigo-50/30">
                            <td colSpan={CLASSES.length + 1} className="p-3 border-b border-gray-200 text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em] text-center">--- {day} ---</td>
                            </tr>
                            {TIME_SLOTS.filter(s => s.type === 'class').map(slot => (
                            <tr key={`${day}-${slot.id}`} className="hover:bg-gray-50/50 transition-colors">
                                <td className="sticky left-0 z-20 bg-white p-3 border-b border-r border-gray-100 text-center shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">
                                <div className="text-xs font-black text-gray-800">第 {slot.label} 節</div>
                                <div className="text-[9px] text-gray-400 font-mono mt-0.5">{slot.time}</div>
                                </td>
                                {CLASSES.map(cls => {
                                const lesson = lessons.find(l => l.day === day && l.periodId === slot.id && l.classId === cls);
                                const slotStatus = isClassSlotAvailable(cls, day, slot.id);
                                return (
                                    <td key={`${day}-${slot.id}-${cls}`} className="p-0">
                                    <TimetableCell 
                                        lesson={lesson}
                                        type="class"
                                        isStamping={isStampMode}
                                        isConflicting={lesson ? conflictingLessonIds.has(lesson.id) : false}
                                        isDisabled={!slotStatus.available}
                                        disabledReason={slotStatus.reason}
                                        onClick={() => slotStatus.available && onCellClick(day, slot.id, cls)}
                                        onCopy={() => lesson && onCopyLesson(lesson)}
                                        onToggleLock={() => lesson && onToggleLock?.(lesson)}
                                        onDragStart={(e) => lesson && handleDragStart(e, lesson.id)}
                                        onDragOver={handleDragOver}
                                        onDrop={(e) => slotStatus.available && handleDrop(e, day, slot.id, cls)}
                                    />
                                    </td>
                                );
                                })}
                            </tr>
                            ))}
                        </React.Fragment>
                        ))}
                    </tbody>
                    </table>
                </div>
                </div>
            );
        };

        // --- Sidebar.tsx ---
        const Sidebar: React.FC<any> = ({ currentView, currentFilter, teachers, rooms, onViewChange }) => {
            const renderContent = () => {
                switch (currentView) {
                case 'Class':
                    return (
                    <section className="animate-in slide-in-from-left duration-300">
                        <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 px-2">選擇班級</h3>
                        <div className="grid grid-cols-2 gap-2">
                        {CLASSES.map(cls => (
                            <button key={cls} onClick={() => onViewChange('Class', cls)} className={`px-3 py-4 text-sm rounded-2xl border-2 transition-all font-black ${currentFilter === cls ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white border-gray-50 text-gray-500 hover:border-gray-200'}`}>{cls} 班</button>
                        ))}
                        </div>
                    </section>
                    );
                case 'Teacher':
                    return (
                    <section className="animate-in slide-in-from-left duration-300">
                        <h3 className="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 px-2">選擇老師</h3>
                        <div className="space-y-1 max-h-[calc(100vh-250px)] overflow-y-auto pr-2 custom-scrollbar">
                        {teachers.map(t => (

        /* ==========================================

        const App: React.FC = () => {

            const [isEditing, setIsEditing] = useState(false);

            const [isAIModalOpen, setIsAIModalOpen] = useState(false);

            };

                setFormTeacher1(names[0] || '');
                setFormTeacher2(names[1] || '');
                }
            }, [editingLesson]);

            const conflicts = useMemo(() => {
                const list: Conflict[] = [];
                const teacherMap = new Map<string, string[]>();
                const roomMap = new Map<string, string[]>();
                
                lessons.forEach(l => {
                const names = l.teacher.split(',').map(n => n.trim()).filter(Boolean);
                names.forEach(name => {
                    const key = `${l.day}-${l.periodId}-${name}`;
                    if (!teacherMap.has(key)) teacherMap.set(key, []);
                    teacherMap.get(key)!.push(l.id);
                });
                if (l.room) {
                    const key = `${l.day}-${l.periodId}-${l.room}`;
                    if (!roomMap.has(key)) roomMap.set(key, []);
                    roomMap.get(key)!.push(l.id);
                }
                });

                teacherMap.forEach((ids, key) => {
                if (ids.length > 1) {
                    const parts = key.split('-');
                    const name = parts.pop(); const period = parts.pop(); const day = parts.join('-');
                    list.push({ type: 'Teacher', name: name || '', day: day as DayOfWeek, periodId: parseInt(period || '0'), lessonIds: Array.from(new Set(ids)) });
                }
                });

                roomMap.forEach((ids, key) => {
                if (ids.length > 1) {
                    const parts = key.split('-');
                    const name = parts.pop(); const period = parts.pop(); const day = parts.join('-');
                    list.push({ type: 'Room', name: name || '', day: day as DayOfWeek, periodId: parseInt(period || '0'), lessonIds: Array.from(new Set(ids)) });
                }
                });

                return list;
            }, [lessons]);

            const teacherLessonCounts = useMemo(() => {
                const counts: Record<string, number> = {};

                l.teacher.split(',').forEach(n => {
                    const name = n.trim();
                    if (name) counts[name] = (counts[name] || 0) + 1;
                });
                });
                return counts;
            }, [lessons]);

            const roomLessonCounts = useMemo(() => {
                const counts: Record<string, number> = {};
                lessons.forEach(l => {

                }

            const filteredLessons = useMemo(() => {
                switch (viewMode) {

                case 'Room': return lessons.filter(l => l.room === viewFilter);
                case 'Conflict': return lessons.filter(l => new Set(conflicts.flatMap(c => c.lessonIds)).has(l.id));
                default: return lessons;
                }
            }, [lessons, viewMode, viewFilter, conflicts]);

            const handleMoveLesson = (sourceId: string, targetDay: DayOfWeek, targetPeriodId: number, targetClassId: string) => {
                setLessons(prev => {
                const sourceIndex = prev.findIndex(l => l.id === sourceId);
                if (sourceIndex === -1) return prev;
                const sourceLesson = { ...prev[sourceIndex] };
                const actualTargetClassId = targetClassId || sourceLesson.classId;
                const targetIndex = prev.findIndex(l => l.day === targetDay && l.periodId === targetPeriodId && l.classId === actualTargetClassId);
                const updated = [...prev];
                if (targetIndex !== -1) {
                    const targetLesson = { ...prev[targetIndex] };
                    updated[sourceIndex] = { ...targetLesson, day: sourceLesson.day, periodId: sourceLesson.periodId, classId: sourceLesson.classId };
                    updated[targetIndex] = { ...sourceLesson, day: targetDay, periodId: targetPeriodId, classId: actualTargetClassId };
                } else {
                    updated[sourceIndex] = { ...sourceLesson, day: targetDay, periodId: targetPeriodId, classId: actualTargetClassId };
                }
                return updated;
                });

                    model: 'gemini-3-pro-preview',
                    contents: `你是一位資深教務排課專家。\n目前的教師與配課清單（JSON）：${JSON.stringify(assignments)}\n這份清單定義了哪位老師要在哪個班級上幾節課。\n\n使用者特殊要求：${aiPrompt}\n\n規則：\n1. 嚴格遵守配課清單中的班級、科目與節數。\n2. 不可有教師衝堂（同一教師不可在同一節出現在不同班級）。\n3. 輸出格式必須是 Lesson 陣列的 JSON。\n4. 每節課只能安排一個老師（除非有協同老師）。\n\n目前已排定的課表基礎（供參考）：${JSON.stringify(lessons)}`,
                    config: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: Type.ARRAY,
                        items: {
                        type: Type.OBJECT,
                        properties: {
                            id: { type: Type.STRING }, classId: { type: Type.STRING },
                            day: { type: Type.STRING }, periodId: { type: Type.INTEGER },
                            subject: { type: Type.STRING }, teacher: { type: Type.STRING },

                rowsHtml += `
                <tr>
                    <td class="period-col">1</td>
                    <td class="time-col">08:00-09:00</td>
                    ${type === 'Class' ? generateLessonCells(id, 1, allLessons) : generateTeacherLessonCells(id, 1, allLessons)}
                    <td rowspan="2" style="vertical-align: top;">
                    ${type === 'Class' ? `
                    <div style="margin-bottom: 5px; font-weight: bold;">學生人數<br><span style="font-size:8pt">Total of Students</span></div>
                    <table style="width: 100%; border: none;">
                        <tr><td style="border:none; font-size: 9pt;">女生<br>Girls</td><td style="border:none; font-size: 9pt;">男生<br>Boys</td></tr>
                        <tr><td style="border:none; border-bottom:1px solid #ddd;">&nbsp;</td><td style="border:none; border-bottom:1px solid #ddd;">&nbsp;</td></tr>
                        <tr><td colspan="2" style="border:none; text-align:right; padding-top:5px;">人</td></tr>
                    </table>
                    ` : `&nbsp;`}
                    </td>
                </tr>
                `;

                // 3. 第二節
                rowsHtml += `
                <tr>
                    <td class="period-col">2</td>
                    <td class="time-col">09:00-10:00</td>
                    ${type === 'Class' ? generateLessonCells(id, 2, allLessons) : generateTeacherLessonCells(id, 2, allLessons)}
                </tr>
                `;

                // 4. 大下課 (Recess)
                rowsHtml += `
                <tr>
                    <td class="period-col">大下課</td>
                    <td class="time-col">10:00-10:30</td>
                    <td colspan="5" class="merged-event">下課時間 Recess</td>
                    <td rowspan="8" style="vertical-align: top; text-align: left;">
                    <div style="text-align: center; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 2px;">授課科目 Subjects</div>
                    <div class="subject-list">
                        ${subjects.map(s => `<span class="subject-item\">▪ ${s}</span>`).join('<br>')}
                    </div>
                    </td>
                </tr>
                `;

                // 5. 第三節
                rowsHtml += `
                <tr>
                    <td class="period-col">3</td>
                    <td class="time-col">10:30-11:15</td>
                    ${type === 'Class' ? generateLessonCells(id, 3, allLessons) : generateTeacherLessonCells(id, 3, allLessons)}
                </tr>
                `;

                // 6. 第四節
                rowsHtml += `
                <tr>
                    <td class="period-col">4</td>
                    <td class="time-col">11:20-12:05</td>
                    ${type === 'Class' ? generateLessonCells(id, 4, allLessons) : generateTeacherLessonCells(id, 4, allLessons)}
                </tr>
                `;

                // 7. 午餐
                rowsHtml += `
                <tr>
                    <td class="period-col">午餐</td>
                    <td class="time-col">12:05-12:30</td>
                    <td colspan="5" class="merged-event">午餐 Lunch</td>
                </tr>
                `;

                // 8. 午休
                rowsHtml += `
                <tr>
                    <td class="period-col">午休</td>
                    <td class="time-col">12:30-13:10</td>
                    <td colspan="5" class="merged-event">午休 Quiet Time</td>
                </tr>
                `;

                // 9. 第五節
                rowsHtml += `
                <tr>
                    <td class="period-col">5</td>
                    <td class="time-col">13:15-14:00</td>
                    ${type === 'Class' ? generateLessonCells(id, 5, allLessons) : generateTeacherLessonCells(id, 5, allLessons)}
                </tr>
                `;

                // 10. 第六節
                rowsHtml += `
                <tr>
                    <td class="period-col">6</td>
                    <td class="time-col">14:05-14:50</td>
                    ${type === 'Class' ? generateLessonCells(id, 6, allLessons) : generateTeacherLessonCells(id, 6, allLessons)}
                </tr>
                `;

                // 11. 第七節
                rowsHtml += `
                <tr>
                    <td class="period-col">7</td>
                    <td class="time-col">14:50-15:30</td>
                    ${type === 'Class' ? generateLessonCells(id, 7, allLessons) : generateTeacherLessonCells(id, 7, allLessons)}
                </tr>
                `;

                return rowsHtml;
            };

            // 輔助函式：產生課程單元格 HTML (班級視角)
            const generateLessonCells = (classId: string, periodId: number, allLessons: Lesson[]) => {
                return DAYS.map(day => {
                const lesson = allLessons.find(l => l.classId === classId && l.periodId === periodId && l.day === day);
                if (lesson) {
                    return `
                    <td>
                        <span class="lesson-subject">${lesson.subject}</span>
                        <span class="lesson-teacher">${lesson.teacher}</span>
                        ${lesson.room ? `<br><span class="lesson-room">📍${lesson.room}</span>` : ''}
                    </td>
                    `;
                } else {
                    return `<td></td>`;
                }
                }).join('');
            };

            // 輔助函式：產生課程單元格 HTML (教師視角)
            const generateTeacherLessonCells = (teacherName: string, periodId: number, allLessons: Lesson[]) => {
                return DAYS.map(day => {
                // 找出該老師在該時段的所有課程 (可能有協同教學)
                const lesson = allLessons.find(l => l.teacher.includes(teacherName) && l.periodId === periodId && l.day === day);
                if (lesson) {
                    return `
                    <td>
                        <span class="lesson-subject">${lesson.subject}</span>
                        <span class="lesson-teacher">${lesson.classId} 班</span>
                        ${lesson.room ? `<br><span class="lesson-room\">📍${lesson.room}</span>` : ''}
                    </td>
                    `;
                } else {
                    return `<td></td>`;
                }
                }).join('');
            };

            const handleImportClick = () => { fileInputRef.current?.click(); };

            const handleFileChange = (e: React.ChangeEvent<HTMLInputElement>) => {
                const file = e.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target?.result as string);
                    if (data.teachers) setTeachers(data.teachers as string[]);
                    if (data.rooms) setRooms(data.rooms as string[]);
                    if (data.lessons) setLessons(data.lessons as Lesson[]);
                    if (data.assignments) setAssignments(data.assignments);
                    alert('匯入成功！');
                } catch (err) {
                    alert('檔案格式錯誤，匯入失敗。');
                }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="min-h-screen bg-gray-50 flex font-sans text-gray-900 overflow-x-hidden">
                <Sidebar 
                    currentView={viewMode} 
                    currentFilter={viewFilter} 
                    teachers={teachers} 
                    rooms={rooms} 
                    onViewChange={(mode, filter) => { setViewMode(mode); setViewFilter(filter); }} 
                />
                
                <main className="flex-1 p-4 lg:p-10">
                    <header className="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10 no-print">
                    <div className="flex gap-2 bg-white p-1.5 rounded-[2rem] shadow-sm border border-gray-100">
                        <button onClick={() => switchMode('Master')} className={`px-6 py-3 text-xs font-black rounded-full transition-all ${viewMode === 'Master' ? 'bg-gray-900 text-white shadow-xl' : 'text-gray-400 hover:text-gray-900'}`}>全校總表</button>
                        <button onClick={() => switchMode('Class')} className={`px-6 py-3 text-xs font-black rounded-full transition-all ${viewMode === 'Class' ? 'bg-gray-900 text-white shadow-xl' : 'text-gray-400 hover:text-gray-900'}`}>班級課表</button>
                        <button onClick={() => switchMode('Teacher')} className={`px-6 py-3 text-xs font-black rounded-full transition-all ${viewMode === 'Teacher' ? 'bg-gray-900 text-white shadow-xl' : 'text-gray-400 hover:text-gray-900'}`}>教師課表</button>
                        <button onClick={() => switchMode('Room')} className={`px-6 py-3 text-xs font-black rounded-full transition-all ${viewMode === 'Room' ? 'bg-gray-900 text-white shadow-xl' : 'text-gray-400 hover:text-gray-900'}`}>場地課表</button>
                    </div>

                    <div className="flex items-center gap-3">
                        <button onClick={() => setIsStampMode(!isStampMode)} className={`px-5 py-3 rounded-2xl text-xs font-black transition-all border-2 ${isStampMode ? 'bg-indigo-600 text-white border-indigo-600 shadow-lg' : 'bg-white text-indigo-600 border-indigo-50 hover:border-indigo-200'}`}>
                        {isStampMode ? '✨ 關閉印章' : '🎨 印章模式'}
                        </button>
                        <button onClick={() => switchMode('Conflict')} className={`px-5 py-3 rounded-2xl text-xs font-black transition-all ${conflicts.length > 0 ? 'bg-red-500 text-white animate-pulse' : 'bg-white text-gray-400 border border-gray-100'}`}>
                        ⚠️ 衝堂檢核 ({conflicts.length})
                        </button>
                        <button onClick={() => setIsAIModalOpen(true)} className="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl text-xs font-black shadow-xl shadow-indigo-100 hover:scale-105 active:scale-95 transition-all">
                        🪄 AI 自動排課
                        </button>
                        <div className="h-8 w-px bg-gray-200 mx-2"></div>
                        <button onClick={handleImportClick} className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-100 shadow-sm hover:bg-gray-50 transition-colors" title="匯入課表數據 (JSON)">📥</button>
                        <button onClick={handleExport} className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-100 shadow-sm hover:bg-gray-50 transition-colors" title="匯出課表數據 (JSON)">💾</button>
                        <button onClick={handleExportWord} className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-100 shadow-sm hover:bg-gray-50 transition-colors" title="匯出全校課表(含教師) Word">📝</button>
                        <button onClick={() => switchMode('TeacherAdmin')} className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-100 shadow-sm hover:bg-gray-50 transition-colors" title="管理老師">👥</button>
                        <button onClick={() => switchMode('RoomAdmin')} className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-100 shadow-sm hover:bg-gray-50 transition-colors" title="管理場地">🏫</button>
                    </div>
                    </header>

                    {viewMode === 'Master' && (
                    <MasterMatrix 
                        lessons={lessons} 
                        isStampMode={isStampMode}
                        onCellClick={handleCellClick} 
                        onMoveLesson={handleMoveLesson} 
                        onCopyLesson={(l) => { setClipboard(l); setIsStampMode(true); }}
                        onClearAll={handleClearAllLessons}
                    />
                    )}

                    {(viewMode === 'Class' || viewMode === 'Teacher' || viewMode === 'Room') && (
                    <TimetableGrid 
                        lessons={filteredLessons} 
                        title={viewFilter + (viewMode === 'Class' ? ' 班級課表' : viewMode === 'Teacher' ? ' 老師課表' : ' 場地課表')}
                        subtitle={viewMode === 'Class' ? '查看該班級的一週課程安排' : '查看個別資源的使用情況'}
                        onCellClick={(day, periodId) => handleCellClick(day, periodId, viewMode === 'Class' ? viewFilter : '')}
                        onMoveLesson={handleMoveLesson}
                        onCopyLesson={(l) => { setClipboard(l); setIsStampMode(true); }}
                        isStampMode={isStampMode}
                        currentClassId={viewMode === 'Class' ? viewFilter : undefined}
                    />
                    )}

                    {viewMode === 'TeacherAdmin' && (
                    <TeacherManager 
                        teachers={teachers} 
                        assignments={assignments}
                        onAddTeacher={(n) => setTeachers(prev => [...prev, n])}
                        onAddBatchTeachers={(names) => setTeachers(prev => [...prev, ...names])}
                        onRemoveTeacher={(n) => setTeachers(prev => prev.filter(t => t !== n))}
                        onUpdateAssignments={(name, as) => setAssignments(prev => ({ ...prev, [name]: as }))}
                        lessonCounts={teacherLessonCounts}
                    />
                    )}

                    {viewMode === 'RoomAdmin' && (
                    <RoomManager 
                        rooms={rooms} 
                        onAddRoom={(n) => setRooms(prev => [...prev, n])} 
                        onRemoveRoom={(n) => setRooms(prev => prev.filter(r => r !== n))} 
                        lessonCounts={roomLessonCounts}
                    />
                    )}

                    {viewMode === 'Conflict' && (
                    <ConflictList 
                        conflicts={conflicts} 
                        lessons={lessons} 
                        onLessonEdit={(l) => { setEditingLesson(l); setIsEditing(true); }}
                    />
                    )}
                </main>

                {/* AI Modal */}
                {isAIModalOpen && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-6 animate-in fade-in duration-300 no-print">
                    <div className="bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300">
                        <div className="p-10 bg-indigo-900 text-white">
                        <h3 className="text-3xl font-black mb-2">AI 智能排課助理</h3>
                        <p className="text-indigo-300 font-medium">請描述您的排課偏好或限制，Gemini 將為您生成最佳方案。</p>
                        </div>
                        <div className="p-10 space-y-6">
                        <textarea 
                            className="w-full h-48 p-6 rounded-[2rem] bg-gray-50 border-2 border-transparent focus:border-indigo-500 outline-none font-bold text-lg shadow-inner resize-none transition-all"
                            placeholder="例如：請優先將主科排在上午，並確保王老師週一早上沒課..."
                            value={aiPrompt}
                            onChange={e => setAiPrompt(e.target.value)}
                        />
                        <div className="flex gap-4">
                            <button 
                            onClick={() => setIsAIModalOpen(false)}
                            className="flex-1 py-5 text-gray-500 font-black hover:bg-gray-50 rounded-2xl transition-all"
                            >
                            取消
                            </button>
                            <button 
                            onClick={runAIScheduling}
                            disabled={isAILoading}
                            className="flex-[2] py-5 bg-indigo-600 text-white rounded-2xl font-black shadow-xl shadow-indigo-100 hover:bg-indigo-700 disabled:opacity-50 flex items-center justify-center gap-3"
                            >
                            {isAILoading ? (
                                <><div className="w-5 h-5 border-4 border-white/30 border-t-white rounded-full animate-spin"></div> 運算中...</>
                            ) : '✨ 開始排課'}
                            </button>
                        </div>
                        </div>
                    </div>
                    </div>
                )}

                {/* Edit Modal */}
                {isEditing && (
                    <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-6 animate-in fade-in duration-300 no-print">
                    <div className="bg-white w-full max-w-lg rounded-[3rem] shadow-2xl overflow-hidden">
                        <div className="p-8 bg-gray-900 text-white flex justify-between items-center">
                        <h3 className="text-xl font-black">{editingLesson?.id ? '修改課程' : '新增課程'}</h3>
                        <button onClick={() => setIsEditing(false)} className="text-gray-400 hover:text-white">✕</button>
                        </div>
                        <div className="p-8 space-y-5">
                        <div>
                            <label className="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">科目 Subject</label>
                            <input className="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 outline-none font-black shadow-inner" value={editingLesson?.subject || ''} onChange={e => setEditingLesson(prev => ({ ...prev, subject: e.target.value }))} placeholder="例如：國語" />
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                            <label className="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">主要教師</label>
                            <select className="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 outline-none font-black shadow-inner" value={formTeacher1} onChange={e => setFormTeacher1(e.target.value)}>
                                <option value="">請選擇</option>
                                {teachers.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                            </div>
                            <div>
                            <label className="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">協同教師 (選填)</label>
                            <select className="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 outline-none font-black shadow-inner" value={formTeacher2} onChange={e => setFormTeacher2(e.target.value)}>
                                <option value="">無</option>
                                {teachers.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                            </div>
                        </div>

                        <div>
                            <label className="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">授課地點 Room</label>
                            <select className="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 outline-none font-black shadow-inner" value={editingLesson?.room || ''} onChange={e => setEditingLesson(prev => ({ ...prev, room: e.target.value }))}>
                            <option value="">原班級教室</option>
                            {rooms.map(r => <option key={r} value={r}>{r}</option>)}
                            </select>
                        </div>

                        <div className="flex gap-4 pt-4">
                            {editingLesson?.id && (
                            <button onClick={handleDeleteLesson} className="flex-1 py-4 bg-red-50 text-red-600 rounded-2xl font-black hover:bg-red-500 hover:text-white transition-all">刪除</button>
                            )}
                            <button onClick={handleSaveLesson} className="flex-[2] py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">儲存變更</button>
                        </div>
                        </div>
                    </div>
                    </div>
                )}

                {/* 隱藏的檔案輸入框 */}
                <input 
                    type="file" 
                    ref={fileInputRef} 
                    onChange={handleFileChange} 
                    accept=".json" 
                    className="hidden" 
                />
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
