<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>均一學校排課與匯出系統gemini-3.8-flash</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- React 18 UMD (原生瀏覽器執行) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f9fafb; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        @media print {
            aside, button, .no-print { display: none !important; }
            main { padding: 0 !important; height: auto !important; overflow: visible !important; }
            .bg-white { border: none !important; box-shadow: none !important; }
            .overflow-x-auto { overflow: visible !important; }
            h1, h2 { color: black !important; }
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">
    <div id="root"></div>

    <script>
        const { useState, useMemo, useRef, useEffect, createElement: h, Fragment } = React;

        /* ==========================================
           常數與排課規則定義 (Constants & Rules)
           ========================================== */
        const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
        const CLASSES = ['101', '201', '301', '401', '501', '601'];
        const INITIAL_ROOMS = ['圖書館', '音樂教室', '手工教室', '泥塑教室', '美術教室', '活動中心'];

        const TIME_SLOTS = [
            { id: 0, label: 'Morning', time: '07:50-08:00', type: 'event' },
            { id: 1, label: '1', time: '08:00-09:00', type: 'class' },
            { id: 2, label: '2', time: '09:00-10:00', type: 'class' },
            { id: 10, label: 'Recess', time: '10:00-10:30', type: 'break' },
            { id: 3, label: '3', time: '10:30-11:10', type: 'class' },
            { id: 4, label: '4', time: '11:20-12:00', type: 'class' },
            { id: 11, label: 'Lunch', time: '12:05-12:30', type: 'break' },
            { id: 12, label: 'Quiet', time: '12:30-13:20', type: 'break' },
            { id: 5, label: '5', time: '13:20-14:00', type: 'class' },
            { id: 6, label: '6', time: '14:10-14:50', type: 'class' },
            { id: 7, label: '7', time: '14:50-15:30', type: 'class' }
        ];

        const COLOR_OPTIONS = [
            { label: '主課程', value: 'bg-blue-100 border-blue-200' },
            { label: '英文', value: 'bg-purple-100 border-purple-200' },
            { label: '藝術', value: 'bg-orange-100 border-orange-200' },
            { label: '活動', value: 'bg-yellow-100 border-yellow-200' },
            { label: '練習', value: 'bg-green-100 border-green-200' },
            { label: '晨圈', value: 'bg-pink-100 border-pink-200' }
        ];

        function isClassSlotAvailable(classId, day, periodId) {
            if (periodId < 1 || periodId > 7) return { available: false, reason: '非課程時段' };
            if (periodId === 7) return { available: false, reason: '第7節全校不排課' };
            if (day === 'Wed' && periodId > 4) return { available: false, reason: '週三下午全校不排課' };
            if (classId === '101' && periodId > 4) return { available: false, reason: '一年級下午放學' };
            if (classId === '201' && (day === 'Mon' || day === 'Wed' || day === 'Fri') && periodId > 4) {
                return { available: false, reason: '二年級週一三五下午放學' };
            }
            return { available: true };
        }

        function getDoublePeriodPartner(periodId) {
            switch (Number(periodId)) {
                case 1: return 2;
                case 2: return 1;
                case 3: return 4;
                case 4: return 3;
                case 5: return 6;
                case 6: return 5;
                default: return null;
            }
        }

        function findAllConflicts(lessons) {
            const list = [];
            const teacherMap = new Map();
            const roomMap = new Map();
            const classMap = new Map();

            lessons.forEach(l => {
                const names = (l.teacher || '').split(',').map(n => n.trim()).filter(Boolean);
                names.forEach(name => {
                    const key = `${l.day}-${l.periodId}-${name}`;
                    if (!teacherMap.has(key)) teacherMap.set(key, []);
                    teacherMap.get(key).push(l.id);
                });
                if (l.room) {
                    const key = `${l.day}-${l.periodId}-${l.room}`;
                    if (!roomMap.has(key)) roomMap.set(key, []);
                    roomMap.get(key).push(l.id);
                }
                const cKey = `${l.day}-${l.periodId}-${l.classId}`;
                if (!classMap.has(cKey)) classMap.set(cKey, []);
                classMap.get(cKey).push(l.id);

                const mask = isClassSlotAvailable(l.classId, l.day, l.periodId);
                if (!mask.available) {
                    list.push({
                        type: 'Mask',
                        name: `${l.classId} 班違規 (${mask.reason})`,
                        day: l.day,
                        periodId: l.periodId,
                        lessonIds: [l.id]
                    });
                }
            });

            teacherMap.forEach((ids, key) => {
                if (ids.length > 1) {
                    const parts = key.split('-');
                    const name = parts.pop();
                    const period = parseInt(parts.pop() || '0');
                    const day = parts.join('-');
                    list.push({ type: 'Teacher', name: `${name} 老師衝堂`, day, periodId: period, lessonIds: Array.from(new Set(ids)) });
                }
            });

            roomMap.forEach((ids, key) => {
                if (ids.length > 1) {
                    const parts = key.split('-');
                    const name = parts.pop();
                    const period = parseInt(parts.pop() || '0');
                    const day = parts.join('-');
                    list.push({ type: 'Room', name: `${name} 場地重疊`, day, periodId: period, lessonIds: Array.from(new Set(ids)) });
                }
            });

            classMap.forEach((ids, key) => {
                if (ids.length > 1) {
                    const parts = key.split('-');
                    const cls = parts.pop();
                    const period = parseInt(parts.pop() || '0');
                    const day = parts.join('-');
                    list.push({ type: 'Class', name: `${cls} 班同節重複排課`, day, periodId: period, lessonIds: Array.from(new Set(ids)) });
                }
            });

            return list;
        }

        function resolveAllConflicts(lessons, assignments, rooms) {
            let workingLessons = JSON.parse(JSON.stringify(lessons));
            let resolvedCount = 0;
            let iterations = 0;

            while (iterations < 20) {
                iterations++;
                const curConflicts = findAllConflicts(workingLessons);
                if (curConflicts.length === 0) break;

                let movableConflictFound = false;

                for (const conflict of curConflicts) {
                    const movableLesson = workingLessons.find(l => conflict.lessonIds.includes(l.id) && !l.isLocked);
                    if (!movableLesson) continue;

                    let foundSlot = false;
                    for (const day of DAYS) {
                        for (let p = 1; p <= 6; p++) {
                            if (!isClassSlotAvailable(movableLesson.classId, day, p).available) continue;
                            const classOccupied = workingLessons.some(l => l.id !== movableLesson.id && l.classId === movableLesson.classId && l.day === day && l.periodId === p);
                            if (classOccupied) continue;

                            const teachers = movableLesson.teacher.split(',').map(t => t.trim());
                            const teacherBusy = workingLessons.some(l => l.id !== movableLesson.id && l.day === day && l.periodId === p && l.teacher.split(',').map(t => t.trim()).some(t => teachers.includes(t)));
                            if (teacherBusy) continue;

                            if (movableLesson.room) {
                                const roomBusy = workingLessons.some(l => l.id !== movableLesson.id && l.day === day && l.periodId === p && l.room === movableLesson.room);
                                if (roomBusy) continue;
                            }

                            if (movableLesson.isDouble) {
                                const partner = getDoublePeriodPartner(p);
                                if (!partner || !isClassSlotAvailable(movableLesson.classId, day, partner).available) continue;
                                const pClassOccupied = workingLessons.some(l => l.id !== movableLesson.id && l.classId === movableLesson.classId && l.day === day && l.periodId === partner);
                                if (pClassOccupied) continue;
                            }

                            movableLesson.day = day;
                            movableLesson.periodId = p;
                            resolvedCount++;
                            foundSlot = true;
                            movableConflictFound = true;
                            break;
                        }
                        if (foundSlot) break;
                    }
                }
                if (!movableConflictFound) break;
            }

            const remaining = findAllConflicts(workingLessons);
            return { resolvedLessons: workingLessons, resolvedCount, remainingConflicts: remaining };
        }

        function validateDoublePeriods(lessons) {
            return lessons.map(l => {
                if (!l.isDouble) return l;
                const partner = getDoublePeriodPartner(l.periodId);
                const hasPartner = partner && lessons.some(other => 
                    other.classId === l.classId && other.day === l.day && other.periodId === partner && other.subject === l.subject
                );
                return { ...l, isDouble: !!hasPartner };
            });
        }

        /* ==========================================
           組件：單元格 (TimetableCell)
           ========================================== */
        function TimetableCell(props) {
            const { lesson, type, label, onClick, onCopy, onToggleLock, onDragStart, onDragOver, onDrop, isStamping, isConflicting, isDisabled, disabledReason } = props;

            if (type === 'break' || type === 'event') {
                return h('div', { className: 'h-full w-full flex items-center justify-center bg-gray-50 text-gray-500 text-[10px] font-bold border-b border-r border-gray-200 uppercase tracking-tighter' }, label);
            }

            if (isDisabled) {
                return h('div', {
                    className: 'h-full w-full p-2 flex flex-col items-center justify-center text-center border-b border-r border-gray-200 min-h-[85px] bg-gray-100/70 select-none cursor-not-allowed group relative',
                    title: disabledReason ? `【遮罩禁排】${disabledReason}` : '此時段不排課'
                }, [
                    h('div', { key: 'bg', className: 'absolute inset-0 bg-[repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6_10px,#e5e7eb_10px,#e5e7eb_20px)] opacity-60' }),
                    h('div', { key: 'content', className: 'relative z-10 flex flex-col items-center justify-center px-1' }, [
                        h('span', { className: 'text-[11px] font-bold text-gray-400 flex items-center gap-1' }, [
                            h('span', { className: 'text-xs' }, '🚫'),
                            h('span', { className: 'truncate max-w-[85px]' }, disabledReason || '禁排時段')
                        ])
                    ])
                ]);
            }

            return h('div', {
                onClick,
                draggable: !!lesson && !isStamping && !lesson.isLocked,
                onDragStart,
                onDragOver,
                onDrop,
                className: `h-full w-full p-2 flex flex-col items-center justify-center text-center cursor-pointer transition-all border-b border-r border-gray-200 min-h-[85px] relative group ${
                    lesson ? `${lesson.color} shadow-sm active:scale-95 active:opacity-50` : 'hover:bg-indigo-50/50'
                } ${isStamping ? 'hover:ring-4 hover:ring-indigo-400 hover:ring-inset' : ''} ${lesson && lesson.isLocked ? 'ring-2 ring-amber-400/50' : ''} ${isConflicting ? 'ring-2 ring-red-500 ring-offset-2 animate-pulse !bg-red-50 !border-red-500' : ''}`
            }, lesson ? [
                isConflicting && h('div', { key: 'conflict-badge', className: 'absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow z-20', title: '衝堂警告' }, '⚠️'),
                h('div', { key: 'title-row', className: 'flex items-center gap-1 flex-wrap justify-center' }, [
                    lesson.isLocked && h('span', { key: 'lock', className: 'inline-block text-xs', title: '已鎖定' }, '🔒'),
                    lesson.isDouble && h('span', { key: 'double', className: 'px-1 py-0.2 bg-indigo-600 text-white text-[8px] font-black rounded tracking-tighter' }, '🔗連堂'),
                    h('span', { key: 'subj', className: 'text-sm font-black text-gray-800 leading-tight' }, lesson.subject)
                ]),
                h('span', { key: 'teacher', className: 'text-[10px] text-gray-600 mt-1 font-bold' }, lesson.teacher),
                lesson.room && h('span', { key: 'room', className: 'text-[9px] text-gray-500/80 mt-0.5 font-medium' }, `📍${lesson.room}`),
                h('div', { key: 'actions', className: 'absolute top-1 right-1 flex space-x-1 opacity-0 group-hover:opacity-100 transition-opacity z-10' }, [
                    !isStamping && onToggleLock && h('button', {
                        key: 'lock-btn',
                        onClick: (e) => { e.stopPropagation(); onToggleLock(e); },
                        className: `bg-white/80 hover:bg-white p-1 rounded-md shadow-sm border ${lesson.isLocked ? 'text-amber-500 border-amber-200' : 'text-gray-400 border-gray-200'}`,
                        title: lesson.isLocked ? '解除鎖定' : '鎖定此課'
                    }, lesson.isLocked ? '🔒' : '🔓'),
                    !isStamping && onCopy && !lesson.isLocked && h('button', {
                        key: 'copy-btn',
                        onClick: (e) => { e.stopPropagation(); onCopy(e); },
                        className: 'bg-white/80 hover:bg-white text-indigo-600 p-1 rounded-md shadow-sm border border-indigo-100',
                        title: '複製'
                    }, '📋')
                ])
            ] : [
                h('span', { key: 'placeholder', className: 'text-indigo-200 text-lg font-black opacity-0 group-hover:opacity-100 transition-opacity' }, '+')
            ]);
        }

        /* ==========================================
           組件：側邊導覽欄 (Sidebar)
           ========================================== */
        function Sidebar({ currentView, currentFilter, teachers, rooms, onViewChange }) {
            let content;
            if (currentView === 'Class') {
                content = h('section', { className: 'animate-in slide-in-from-left duration-300' }, [
                    h('h3', { className: 'text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 px-2' }, '選擇班級 Select Class'),
                    h('div', { className: 'grid grid-cols-2 gap-2' }, CLASSES.map(cls => 
                        h('button', {
                            key: cls,
                            onClick: () => onViewChange('Class', cls),
                            className: `px-3 py-4 text-sm rounded-2xl border-2 transition-all font-black ${currentFilter === cls ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white border-gray-50 text-gray-500 hover:border-gray-200'}`
                        }, `${cls} 班`)
                    ))
                ]);
            } else if (currentView === 'Teacher') {
                content = h('section', { className: 'animate-in slide-in-from-left duration-300' }, [
                    h('h3', { className: 'text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 px-2' }, '選擇老師 Select Teacher'),
                    h('div', { className: 'space-y-1 max-h-[calc(100vh-250px)] overflow-y-auto pr-2 custom-scrollbar' }, teachers.map(t =>
                        h('button', {
                            key: t,
                            onClick: () => onViewChange('Teacher', t),
                            className: `w-full text-left px-5 py-3.5 text-sm rounded-2xl transition-all font-bold mb-1 ${currentFilter === t ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-100' : 'text-gray-500 hover:bg-gray-50 border border-transparent hover:border-gray-100'}`
                        }, `👤 ${t} 老師`)
                    ))
                ]);
            } else if (currentView === 'Room') {
                content = h('section', { className: 'animate-in slide-in-from-left duration-300' }, [
                    h('h3', { className: 'text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 px-2' }, '選擇場地 Select Room'),
                    h('div', { className: 'space-y-1 max-h-[calc(100vh-250px)] overflow-y-auto pr-2 custom-scrollbar' }, rooms.map(r =>
                        h('button', {
                            key: r,
                            onClick: () => onViewChange('Room', r),
                            className: `w-full text-left px-5 py-3.5 text-sm rounded-2xl transition-all font-bold mb-1 ${currentFilter === r ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-100' : 'text-gray-500 hover:bg-gray-50 border border-transparent hover:border-gray-100'}`
                        }, `🎨 ${r}`)
                    ))
                ]);
            } else if (['TeacherAdmin', 'RoomAdmin'].includes(currentView)) {
                content = h('section', { className: 'animate-in slide-in-from-left duration-300' }, [
                    h('div', { className: 'bg-emerald-50 p-6 rounded-3xl border border-emerald-100' }, [
                        h('h3', { className: 'text-xs font-black text-emerald-900 mb-2' }, '名單管理模式'),
                        h('p', { className: 'text-[11px] text-emerald-700 leading-relaxed font-medium' }, '您可以在此新增或移除學校的老師與場地資源。這將同步更新排課時的選擇選單。')
                    ])
                ]);
            } else {
                content = h('div', { className: 'bg-indigo-50 p-6 rounded-3xl border border-indigo-100' }, [
                    h('h3', { className: 'text-xs font-black text-indigo-900 mb-2' }, '系統總覽模式'),
                    h('p', { className: 'text-[11px] text-indigo-700 leading-relaxed font-medium' }, '目前處於全校排課大表。請從上方選單切換至班級或個人課表進行詳細檢視與匯出。')
                ]);
            }

            return h('div', { className: 'w-72 bg-white h-screen border-r border-gray-100 overflow-y-auto hidden lg:flex flex-col p-6 sticky top-0 shrink-0' }, [
                h('div', { className: 'mb-10' }, [
                    h('h1', { className: 'text-2xl font-black text-gray-900 tracking-tighter flex items-center' }, [
                        h('div', { className: 'bg-indigo-600 text-white w-10 h-10 rounded-2xl flex items-center justify-center mr-3 shadow-indigo-100 shadow-xl text-lg font-black italic' }, 'JY'),
                        '均一排課'
                    ]),
                    h('div', { className: 'mt-2 ml-1 px-2 py-0.5 bg-gray-100 inline-block rounded-full' }, [
                        h('p', { className: 'text-[9px] text-gray-500 font-black uppercase tracking-[0.1em]' }, 'ADMIN DASHBOARD')
                    ])
                ]),
                h('div', { className: 'flex-1' }, content),
                h('div', { className: 'mt-8 pt-8 border-t border-gray-50' }, [
                    h('div', { className: `p-5 rounded-3xl shadow-xl shadow-gray-200 transition-colors ${currentView === 'Room' ? 'bg-emerald-900' : 'bg-gray-900'} text-white` }, [
                        h('p', { className: 'text-[10px] text-gray-400 uppercase font-black tracking-widest' }, '目前檢視內容'),
                        h('p', { className: 'text-sm font-black mt-2 text-indigo-300' }, 
                            currentView === 'Master' ? '全校總表' : 
                            currentView === 'Conflict' ? '衝堂檢查' : 
                            currentView === 'TeacherAdmin' ? '管理老師' :
                            currentView === 'RoomAdmin' ? '管理場地' :
                            `${currentFilter} ${currentView === 'Class' ? '班級' : currentView === 'Teacher' ? '老師' : '教室'}`
                        )
                    ])
                ])
            ]);
        }

        /* ==========================================
           組件：全校大課表矩陣 (MasterMatrix)
           ========================================== */
        function MasterMatrix({ lessons, onCellClick, onMoveLesson, onCopyLesson, onToggleLock, onLockAll, onUnlockAll, onClearAll, isStampMode, conflictingLessonIds = new Set(), onAutoResolve, conflictCount = 0 }) {
            const [confirmStep, setConfirmStep] = useState(0);

            useEffect(() => {
                if (confirmStep === 1) {
                    const timer = setTimeout(() => setConfirmStep(0), 3000);
                    return () => clearTimeout(timer);
                }
            }, [confirmStep]);

            const handleDragStart = (e, lessonId) => e.dataTransfer.setData('lessonId', lessonId);
            const handleDragOver = (e) => e.preventDefault();
            const handleDrop = (e, day, periodId, classId) => {
                e.preventDefault();
                const sourceId = e.dataTransfer.getData('lessonId');
                if (sourceId) onMoveLesson(sourceId, day, periodId, classId);
            };

            return h('div', { className: 'bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100 animate-in fade-in zoom-in-95 duration-500' }, [
                h('div', { className: 'p-8 bg-indigo-900 text-white flex justify-between items-center' }, [
                    h('div', null, [
                        h('h2', { className: 'text-2xl font-black tracking-tight' }, '全校大課表 (Master Schedule)'),
                        h('div', { className: 'flex items-center gap-2 mt-1' }, [
                            h('span', { className: 'px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 rounded-full text-[10px] font-black' }, '🛡️ 班級作息遮罩已啟用'),
                            h('p', { className: 'text-indigo-300 text-xs font-medium' }, isStampMode ? '✨ 印章模式已啟用：點擊任何可用空格即可蓋上課程' : '💡 提示：按住課程可拖拽調課，點擊 📋 可複製課程；🚫 為年級放學禁排時段')
                        ])
                    ]),
                    h('div', { className: 'flex gap-3 items-center' }, [
                        conflictCount > 0 && onAutoResolve && h('button', {
                            onClick: onAutoResolve,
                            className: 'px-4 py-2 rounded-xl text-xs font-black bg-gradient-to-r from-red-500 to-amber-500 text-white shadow-md hover:scale-105 active:scale-95 transition-all flex items-center gap-1.5 no-print'
                        }, [
                            h('span', null, '⚡'),
                            h('span', null, `消除衝堂 (${conflictCount})`)
                        ]),
                        h('button', { onClick: onLockAll, className: 'px-4 py-2 rounded-xl text-xs font-bold bg-indigo-800/80 hover:bg-indigo-700 transition-colors border border-indigo-700/50 flex items-center gap-2 no-print' }, '全部鎖定 🔒'),
                        h('button', { onClick: onUnlockAll, className: 'px-4 py-2 rounded-xl text-xs font-bold bg-indigo-800/80 hover:bg-indigo-700 transition-colors border border-indigo-700/50 flex items-center gap-2 no-print' }, '全部解鎖 🔓'),
                        h('button', {
                            onClick: () => { if (confirmStep === 0) setConfirmStep(1); else { onClearAll(); setConfirmStep(0); } },
                            className: `px-5 py-2.5 rounded-xl text-xs font-black shadow-lg transition-all flex items-center gap-2 group active:scale-95 no-print ${confirmStep === 1 ? 'bg-amber-500 hover:bg-amber-600 animate-pulse' : 'bg-red-500 hover:bg-red-600'}`
                        }, confirmStep === 1 ? '確認清空未鎖定？' : '清空未鎖定課程')
                    ])
                ]),
                h('div', { className: 'overflow-x-auto custom-scrollbar' }, [
                    h('table', { className: 'w-full border-collapse border-spacing-0' }, [
                        h('thead', null, [
                            h('tr', { className: 'bg-gray-50' }, [
                                h('th', { className: 'sticky left-0 z-30 bg-gray-50 w-24 p-4 border-b border-r border-gray-200 text-[10px] font-black text-gray-400 uppercase tracking-widest' }, '節次 / 班級'),
                                ...CLASSES.map(cls => h('th', { key: cls, className: 'p-4 border-b border-r border-gray-200 text-sm font-black text-gray-800 bg-gray-50/80' }, `${cls} 班`))
                            ])
                        ]),
                        h('tbody', null, DAYS.map(day => [
                            h('tr', { key: `day-header-${day}`, className: 'bg-indigo-50/30' }, [
                                h('td', { colSpan: CLASSES.length + 1, className: 'p-3 border-b border-gray-200 text-[10px] font-black text-indigo-500 uppercase tracking-[0.2em] text-center' }, `--- ${day} ---`)
                            ]),
                            ...TIME_SLOTS.filter(s => s.type === 'class').map(slot => 
                                h('tr', { key: `${day}-${slot.id}`, className: 'hover:bg-gray-50/50 transition-colors' }, [
                                    h('td', { className: 'sticky left-0 z-20 bg-white p-3 border-b border-r border-gray-100 text-center shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]' }, [
                                        h('div', { className: 'text-xs font-black text-gray-800' }, `第 ${slot.label} 節`),
                                        h('div', { className: 'text-[9px] text-gray-400 font-mono mt-0.5' }, slot.time)
                                    ]),
                                    ...CLASSES.map(cls => {
                                        const lesson = lessons.find(l => l.day === day && l.periodId === slot.id && l.classId === cls);
                                        const slotStatus = isClassSlotAvailable(cls, day, slot.id);
                                        return h('td', { key: `${day}-${slot.id}-${cls}`, className: 'p-0' }, [
                                            h(TimetableCell, {
                                                lesson,
                                                type: 'class',
                                                isStamping: isStampMode,
                                                isConflicting: lesson ? conflictingLessonIds.has(lesson.id) : false,
                                                isDisabled: !slotStatus.available,
                                                disabledReason: slotStatus.reason,
                                                onClick: () => slotStatus.available && onCellClick(day, slot.id, cls),
                                                onCopy: () => lesson && onCopyLesson(lesson),
                                                onToggleLock: () => lesson && onToggleLock(lesson),
                                                onDragStart: (e) => lesson && handleDragStart(e, lesson.id),
                                                onDragOver: handleDragOver,
                                                onDrop: (e) => slotStatus.available && handleDrop(e, day, slot.id, cls)
                                            })
                                        ]);
                                    })
                                ])
                            )
                        ]))
                    ])
                ])
            ]);
        }

        /* ==========================================
           組件：單一課表視圖 (TimetableGrid)
           ========================================== */
        function TimetableGrid({ lessons, title, onCellClick, onMoveLesson, onCopyLesson, onToggleLock, isStampMode, currentClassId, conflictingLessonIds = new Set() }) {
            const handleDragStart = (e, lessonId) => e.dataTransfer.setData('lessonId', lessonId);
            const handleDragOver = (e) => e.preventDefault();
            const handleDrop = (e, day, periodId) => {
                e.preventDefault();
                const sourceId = e.dataTransfer.getData('lessonId');
                if (sourceId && currentClassId) onMoveLesson(sourceId, day, periodId, currentClassId);
            };

            return h('div', { className: 'bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100 animate-in fade-in slide-in-from-bottom-4 duration-700' }, [
                h('div', { className: 'p-8 bg-gray-900 text-white flex justify-between items-center' }, [
                    h('div', null, [
                        h('h2', { className: 'text-2xl font-black tracking-tight' }, title),
                        isStampMode && h('p', { className: 'text-indigo-400 text-xs font-black mt-2 no-print' }, '✨ 印章模式：點擊下方空格快速蓋章')
                    ])
                ]),
                h('div', { className: 'overflow-x-auto custom-scrollbar' }, [
                    h('table', { className: 'w-full border-collapse table-fixed min-w-[800px]' }, [
                        h('thead', null, [
                            h('tr', { className: 'bg-gray-50' }, [
                                h('th', { className: 'w-24 p-4 border-b border-r border-gray-200 text-[10px] font-black text-gray-400 uppercase tracking-widest' }, '時間節次'),
                                ...DAYS.map(day => h('th', { key: day, className: 'p-4 border-b border-r border-gray-200 text-sm font-black text-gray-700 uppercase' }, day))
                            ])
                        ]),
                        h('tbody', null, TIME_SLOTS.map(slot => 
                            h('tr', { key: slot.id, className: 'group hover:bg-gray-50/30 transition-colors' }, [
                                h('td', { className: 'p-3 border-b border-r border-gray-100 bg-white text-center' }, [
                                    h('div', { className: 'text-xs font-black text-gray-800' }, slot.label),
                                    h('div', { className: 'text-[10px] text-gray-400 mt-0.5 font-mono' }, slot.time)
                                ]),
                                ...DAYS.map(day => {
                                    const lesson = lessons.find(l => l.day === day && l.periodId === slot.id);
                                    const slotStatus = currentClassId && slot.type === 'class' ? isClassSlotAvailable(currentClassId, day, slot.id) : null;
                                    const isSlotDisabled = slotStatus ? !slotStatus.available : (slot.type === 'class' && slot.id === 7);
                                    const disabledReason = slotStatus ? slotStatus.reason : (slot.id === 7 ? '第7節全校不排課' : undefined);

                                    return h('td', { key: `${day}-${slot.id}`, className: 'p-0' }, [
                                        h(TimetableCell, {
                                            lesson,
                                            type: slot.type,
                                            isStamping: isStampMode,
                                            isConflicting: lesson ? conflictingLessonIds.has(lesson.id) : false,
                                            isDisabled: isSlotDisabled,
                                            disabledReason,
                                            label: slot.type !== 'class' ? slot.label : undefined,
                                            onClick: () => !isSlotDisabled && slot.type === 'class' && onCellClick && onCellClick(day, slot.id),
                                            onCopy: () => lesson && onCopyLesson && onCopyLesson(lesson),
                                            onToggleLock: () => lesson && onToggleLock && onToggleLock(lesson),
                                            onDragStart: (e) => lesson && handleDragStart(e, lesson.id),
                                            onDragOver: handleDragOver,
                                            onDrop: (e) => !isSlotDisabled && slot.type === 'class' && handleDrop(e, day, slot.id)
                                        })
                                    ]);
                                })
                            ])
                        ))
                    ])
                ])
            ]);
        }

        /* ==========================================
           組件：師資與配課管理 (TeacherManager)
           ========================================== */
        function TeacherManager({ teachers, assignments, onAddTeacher, onAddBatchTeachers, onRemoveTeacher, onUpdateAssignments, lessonCounts, lessons = [], onSyncDoublePeriods }) {
            const [newName, setNewName] = useState('');
            const [importText, setImportText] = useState('');
            const [mode, setMode] = useState('single');
            const [expandedTeacher, setExpandedTeacher] = useState(null);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (newName.trim()) {
                    onAddTeacher(newName.trim());
                    setNewName('');
                }
            };

            const handleBatchSubmit = () => {
                const names = importText.split(/[\n,，、\s]+/).map(n => n.trim()).filter(n => n !== "" && !teachers.includes(n));
                if (names.length > 0) {
                    onAddBatchTeachers(names);
                    setImportText('');
                    setMode('single');
                }
            };

            const handleAddAssignment = (teacherName) => {
                const current = assignments[teacherName] || [];
                onUpdateAssignments(teacherName, [...current, { subject: '新科目', classId: CLASSES[0], sessions: 2, isDouble: false }]);
            };

            const updateAssignment = (teacherName, index, field, value) => {
                const current = [...(assignments[teacherName] || [])];
                current[index] = { ...current[index], [field]: value };
                onUpdateAssignments(teacherName, current);
            };

            const removeAssignment = (teacherName, index) => {
                const current = (assignments[teacherName] || []).filter((_, i) => i !== index);
                onUpdateAssignments(teacherName, current);
            };

            return h('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-8 animate-in fade-in slide-in-from-bottom-4 duration-500' }, [
                h('div', { className: 'bg-white p-8 rounded-[2.5rem] border border-gray-100 shadow-sm h-fit sticky top-4' }, [
                    h('div', { className: 'flex bg-gray-100 p-1 rounded-2xl mb-6' }, [
                        h('button', { onClick: () => setMode('single'), className: `flex-1 py-2 text-xs font-black rounded-xl transition-all ${mode === 'single' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-400'}` }, '單筆新增'),
                        h('button', { onClick: () => setMode('batch'), className: `flex-1 py-2 text-xs font-black rounded-xl transition-all ${mode === 'batch' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-400'}` }, '批次匯入')
                    ]),
                    mode === 'single' ? h('form', { onSubmit: handleSubmit, className: 'space-y-4' }, [
                        h('h3', { className: 'text-xl font-black text-gray-900 mb-2' }, '新增老師'),
                        h('input', { className: 'w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 outline-none font-bold shadow-inner', value: newName, onChange: e => setNewName(e.target.value), placeholder: '輸入姓名...', required: true }),
                        h('button', { type: 'submit', className: 'w-full py-4 bg-indigo-600 text-white rounded-2xl font-black hover:bg-indigo-700 shadow-xl flex items-center justify-center gap-2' }, '+ 確認新增')
                    ]) : h('div', { className: 'space-y-4' }, [
                        h('h3', { className: 'text-xl font-black text-gray-900 mb-2' }, '批次匯入名單'),
                        h('textarea', { className: 'w-full h-40 px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 font-bold shadow-inner resize-none text-sm', value: importText, onChange: e => setImportText(e.target.value), placeholder: '例如：王小明, 李大華...' }),
                        h('button', { onClick: handleBatchSubmit, className: 'w-full py-4 bg-indigo-900 text-white rounded-2xl font-black hover:bg-black shadow-xl flex items-center justify-center gap-2' }, '🚀 執行批次匯入')
                    ])
                ]),
                h('div', { className: 'md:col-span-2 bg-white rounded-[2.5rem] border border-gray-100 shadow-sm overflow-hidden' }, [
                    h('div', { className: 'p-8 border-b border-gray-50 flex justify-between items-center bg-gray-50/50' }, [
                        h('div', null, [
                            h('h3', { className: 'text-xl font-black text-gray-900' }, '師資與配課管理'),
                            h('p', { className: 'text-xs text-gray-400 font-bold mt-1' }, '勾選連堂後可隨時點擊同步，系統將自動於課表成對配對排課')
                        ]),
                        h('div', { className: 'flex items-center gap-3' }, [
                            onSyncDoublePeriods && h('button', {
                                onClick: onSyncDoublePeriods,
                                className: 'px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-black rounded-full transition-all shadow-sm flex items-center gap-1.5 active:scale-95'
                            }, '🔗 同步並對齊連堂'),
                            h('span', { className: 'px-5 py-2 bg-indigo-600 rounded-full text-xs font-black text-white shadow-lg' }, `共 ${teachers.length} 位`)
                        ])
                    ]),
                    h('div', { className: 'divide-y divide-gray-50 overflow-y-auto max-h-[800px] custom-scrollbar' }, teachers.map(name => {
                        const isExpanded = expandedTeacher === name;
                        const teacherAssignments = assignments[name] || [];
                        const totalAssigned = teacherAssignments.reduce((sum, a) => sum + Number(a.sessions), 0);
                        const scheduled = lessonCounts[name] || 0;

                        return h('div', { key: name, className: 'flex flex-col transition-all' }, [
                            h('div', {
                                onClick: () => setExpandedTeacher(isExpanded ? null : name),
                                className: `flex items-center justify-between p-6 cursor-pointer hover:bg-indigo-50/30 ${isExpanded ? 'bg-indigo-50/50' : ''}`
                            }, [
                                h('div', { className: 'flex items-center gap-4' }, [
                                    h('div', { className: 'w-12 h-12 rounded-2xl bg-indigo-100 flex items-center justify-center text-indigo-600 font-black shadow-inner text-lg' }, name.charAt(0)),
                                    h('div', null, [
                                        h('p', { className: 'font-black text-gray-900 text-lg' }, name),
                                        h('div', { className: 'flex items-center gap-3 mt-1' }, [
                                            h('span', { className: 'text-[10px] font-black uppercase text-gray-400' }, `配課總額: ${totalAssigned} 節`),
                                            h('span', { className: `text-[10px] font-black uppercase px-2 py-0.5 rounded ${scheduled < totalAssigned ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'}` }, `已排課: ${scheduled} / ${totalAssigned}`)
                                        ])
                                    ])
                                ]),
                                h('div', { className: 'flex items-center gap-2' }, [
                                    h('button', {
                                        onClick: (e) => { e.stopPropagation(); onRemoveTeacher(name); },
                                        className: `w-10 h-10 rounded-xl flex items-center justify-center bg-red-50 text-red-400 hover:bg-red-500 hover:text-white transition-all ${scheduled > 0 ? 'opacity-20 cursor-not-allowed' : ''}`,
                                        disabled: scheduled > 0
                                    }, '✕'),
                                    h('span', { className: `text-gray-400 transition-transform ${isExpanded ? 'rotate-180' : ''}` }, '▼')
                                ])
                            ]),
                            isExpanded && h('div', { className: 'p-8 bg-gray-50/50 border-t border-gray-100 space-y-4 animate-in slide-in-from-top-4 duration-300' }, [
                                h('div', { className: 'flex justify-between items-center mb-4' }, [
                                    h('h4', { className: 'text-sm font-black text-indigo-900 uppercase tracking-widest' }, '分配班級與節數'),
                                    h('button', { onClick: () => handleAddAssignment(name), className: 'px-4 py-2 bg-indigo-600 text-white text-xs font-black rounded-xl shadow-md' }, '+ 新增配課')
                                ]),
                                teacherAssignments.length === 0 ? h('div', { className: 'py-10 text-center border-2 border-dashed border-gray-200 rounded-3xl text-gray-400 font-bold' }, '目前尚未設定配課內容')
                                : h('div', { className: 'space-y-3' }, teacherAssignments.map((as, idx) => {
                                    const asCount = lessons.filter(l => l.teacher.includes(name) && l.classId === as.classId && l.subject === as.subject).length;
                                    return h('div', { key: idx, className: 'flex flex-wrap md:flex-nowrap gap-3 items-center' }, [
                                        h('input', { className: 'flex-1 min-w-[120px] px-4 py-3 rounded-xl bg-white border border-gray-200 font-bold text-sm', value: as.subject, onChange: e => updateAssignment(name, idx, 'subject', e.target.value), placeholder: '科目' }),
                                        h('select', { className: 'w-28 px-3 py-3 rounded-xl bg-white border border-gray-200 font-bold text-sm', value: as.classId, onChange: e => updateAssignment(name, idx, 'classId', e.target.value) }, CLASSES.map(c => h('option', { key: c, value: c }, `${c} 班`))),
                                        h('label', { className: 'flex items-center gap-1.5 px-3 py-2.5 rounded-xl bg-white border border-gray-200 cursor-pointer text-xs font-bold' }, [
                                            h('input', { type: 'checkbox', checked: !!as.isDouble, onChange: e => updateAssignment(name, idx, 'isDouble', e.target.checked), className: 'w-4 h-4 text-indigo-600 rounded' }),
                                            h('span', { className: as.isDouble ? 'text-indigo-600 font-black' : 'text-gray-400' }, as.isDouble ? '🔗 連堂' : '單節')
                                        ]),
                                        h('div', { className: 'flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-gray-200' }, [
                                            h('span', { className: 'text-xs font-black text-gray-400' }, '節數:'),
                                            h('input', { type: 'number', min: '1', max: '10', className: 'w-10 text-center font-black text-indigo-600 outline-none', value: as.sessions, onChange: e => updateAssignment(name, idx, 'sessions', parseInt(e.target.value) || 0) }),
                                            h('span', { className: `text-xs font-bold px-2 py-0.5 rounded ${asCount >= as.sessions ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-500'}` }, `已排: ${asCount}/${as.sessions}`)
                                        ]),
                                        h('button', { onClick: () => removeAssignment(name, idx), className: 'text-red-400 hover:text-red-600 p-2' }, '✕')
                                    ]);
                                }))
                            ])
                        ]);
                    }))
                ])
            ]);
        }

        /* ==========================================
           組件：場地管理 (RoomManager)
           ========================================== */
        function RoomManager({ rooms, onAddRoom, onRemoveRoom, lessonCounts }) {
            const [newName, setNewName] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (newName.trim()) {
                    onAddRoom(newName.trim());
                    setNewName('');
                }
            };
            return h('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-8 animate-in fade-in slide-in-from-bottom-4 duration-500' }, [
                h('div', { className: 'bg-white p-8 rounded-[2.5rem] border border-gray-100 shadow-sm h-fit sticky top-4' }, [
                    h('form', { onSubmit: handleSubmit, className: 'space-y-4' }, [
                        h('h3', { className: 'text-xl font-black text-gray-900 mb-2' }, '新增場地'),
                        h('input', { className: 'w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 outline-none font-bold text-gray-800 shadow-inner', value: newName, onChange: e => setNewName(e.target.value), placeholder: '例如：活動中心...', required: true }),
                        h('button', { type: 'submit', className: 'w-full py-4 bg-indigo-600 text-white rounded-2xl font-black hover:bg-indigo-700 shadow-xl' }, '+ 確認新增')
                    ])
                ]),
                h('div', { className: 'md:col-span-2 bg-white rounded-[2.5rem] border border-gray-100 shadow-sm overflow-hidden flex flex-col' }, [
                    h('div', { className: 'p-8 border-b border-gray-50 flex justify-between items-center bg-gray-50/50' }, [
                        h('div', null, [
                            h('h3', { className: 'text-xl font-black text-gray-900' }, '目前專科教室庫'),
                            h('p', { className: 'text-[10px] text-gray-400 font-black uppercase tracking-widest mt-1' }, 'Available Rooms')
                        ]),
                        h('span', { className: 'px-5 py-2 bg-indigo-600 rounded-full text-xs font-black text-white shadow-lg' }, `共 ${rooms.length} 個`)
                    ]),
                    h('div', { className: 'p-6 grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[650px] overflow-y-auto custom-scrollbar' }, rooms.map(name => {
                        const count = lessonCounts[name] || 0;
                        return h('div', { key: name, className: 'flex items-center justify-between p-4 rounded-2xl border border-gray-100 hover:bg-indigo-50/30 transition-all' }, [
                            h('div', { className: 'flex items-center gap-4' }, [
                                h('div', { className: 'w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 font-black' }, '🏫'),
                                h('div', null, [
                                    h('p', { className: 'font-black text-gray-800' }, name),
                                    h('span', { className: `text-[9px] px-2 py-0.5 rounded-full font-black ${count > 0 ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-400'}` }, count > 0 ? `使用中 (${count} 節)` : '無使用')
                                ])
                            ]),
                            h('button', {
                                onClick: () => onRemoveRoom(name),
                                disabled: count > 0,
                                className: `w-9 h-9 rounded-xl flex items-center justify-center ${count > 0 ? 'bg-gray-50 text-gray-200 cursor-not-allowed' : 'bg-red-50 text-red-500 hover:bg-red-500 hover:text-white'}`
                            }, '✕')
                        ]);
                    }))
                ])
            ]);
        }

        /* ==========================================
           組件：衝堂檢查與化解 (ConflictList)
           ========================================== */
        function ConflictList({ conflicts, lessons, onLessonEdit, onAutoResolve, onCleanDoublePeriods, onToggleLock }) {
            if (conflicts.length === 0) {
                return h('div', { className: 'flex flex-col items-center justify-center p-20 bg-white rounded-[2.5rem] border-2 border-dashed border-gray-100 text-center' }, [
                    h('div', { className: 'w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center text-4xl mb-6' }, '✅'),
                    h('h3', { className: 'text-2xl font-black text-gray-900' }, '目前沒有發現任何衝堂'),
                    h('p', { className: 'text-gray-400 font-bold mt-2' }, '全校課表合規且無重疊衝突！各班級作息遮罩與教師時段均正常。')
                ]);
            }

            return h('div', { className: 'space-y-6 animate-in fade-in duration-500' }, [
                h('div', { className: 'bg-gradient-to-r from-red-500 via-rose-500 to-indigo-600 p-8 rounded-[2.5rem] text-white shadow-xl flex flex-col lg:flex-row lg:items-center justify-between gap-6' }, [
                    h('div', null, [
                        h('div', { className: 'flex items-center gap-3' }, [
                            h('span', { className: 'text-2xl' }, '⚠️'),
                            h('h3', { className: 'text-xl font-black' }, `偵測到 ${conflicts.length} 處排課衝突`)
                        ]),
                        h('p', { className: 'text-red-100 text-xs mt-2' }, '點擊「一鍵自動消除衝堂」可自動保留鎖定課程（🔒），將衝突項目搬移至安全空時段。')
                    ]),
                    h('div', { className: 'flex flex-wrap gap-3' }, [
                        onAutoResolve && h('button', {
                            onClick: onAutoResolve,
                            className: 'px-6 py-3.5 bg-white text-gray-900 hover:bg-yellow-300 font-black text-xs rounded-2xl shadow-xl transition-all'
                        }, '⚡ 一鍵自動消除衝堂'),
                        onCleanDoublePeriods && h('button', {
                            onClick: onCleanDoublePeriods,
                            className: 'px-5 py-3.5 bg-black/20 text-white font-bold text-xs rounded-2xl'
                        }, '🧹 校正連堂標記')
                    ])
                ]),
                h('div', { className: 'space-y-4' }, conflicts.map((conflict, idx) => 
                    h('div', { key: idx, className: 'bg-white p-6 rounded-[2.5rem] border border-red-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-6' }, [
                        h('div', { className: 'flex items-start gap-5' }, [
                            h('div', { className: 'w-14 h-14 bg-red-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg' }, '⚠️'),
                            h('div', null, [
                                h('h4', { className: 'text-xl font-black text-gray-900' }, conflict.name),
                                h('p', { className: 'text-sm font-bold text-gray-500 mt-1' }, `📅 週${conflict.day} 第 ${conflict.periodId} 節`)
                            ])
                        ]),
                        h('div', { className: 'flex flex-wrap gap-3' }, conflict.lessonIds.map(id => {
                            const l = lessons.find(x => x.id === id);
                            if (!l) return null;
                            return h('div', { key: id, className: 'relative flex flex-col' }, [
                                h('button', {
                                    onClick: () => onLessonEdit(l),
                                    className: `px-5 py-4 pb-10 rounded-[1.5rem] border-2 ${l.color} text-left min-w-[170px]`
                                }, [
                                    h('div', { className: 'font-black text-sm' }, `${l.isLocked ? '🔒 ' : ''}${l.subject}`),
                                    h('div', { className: 'text-xs text-gray-600 mt-1' }, `👨‍🏫 ${l.teacher}`),
                                    h('div', { className: 'text-[11px] text-gray-500' }, `🏫 ${l.classId} 班`)
                                ]),
                                onToggleLock && h('button', {
                                    onClick: (e) => { e.stopPropagation(); onToggleLock(l.id); },
                                    className: 'absolute bottom-2.5 right-3 text-[11px] font-black px-2 py-0.5 rounded-lg bg-white/80 border border-gray-200'
                                }, l.isLocked ? '🔒 解除' : '🔓 鎖定')
                            ]);
                        }))
                    ])
                ))
            ]);
        }

        /* ==========================================
           主應用程式 (App Component)
           ========================================== */
        function App() {
            const [lessons, setLessons] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [rooms, setRooms] = useState(INITIAL_ROOMS);
            const [assignments, setAssignments] = useState({});
            const [viewMode, setViewMode] = useState('Master');
            const [viewFilter, setViewFilter] = useState('all');

            const [isEditing, setIsEditing] = useState(false);
            const [editingLesson, setEditingLesson] = useState(null);
            const [formTeacher1, setFormTeacher1] = useState('');
            const [formTeacher2, setFormTeacher2] = useState('');

            const [isAIModalOpen, setIsAIModalOpen] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [isAILoading, setIsAILoading] = useState(false);

            const [isKeyModalOpen, setIsKeyModalOpen] = useState(false);
            const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || '');

            const [isUpgradeModalOpen, setIsUpgradeModalOpen] = useState(false);
            const [toast, setToast] = useState(null);

            const [clipboard, setClipboard] = useState(null);
            const [isStampMode, setIsStampMode] = useState(false);
            const fileInputRef = useRef(null);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(prev => prev && prev.message === message ? null : prev), 4500);
            };

            const switchMode = (mode) => {
                setViewMode(mode);
                if (['Master', 'Conflict', 'TeacherAdmin', 'RoomAdmin'].includes(mode)) setViewFilter('all');
                else if (mode === 'Class') setViewFilter(CLASSES[0]);
                else if (mode === 'Teacher') setViewFilter(teachers[0] || '');
                else if (mode === 'Room') setViewFilter(rooms[0] || '');
            };

            useEffect(() => {
                if (editingLesson) {
                    const names = (editingLesson.teacher || '').split(',').map(n => n.trim()).filter(Boolean);
                    setFormTeacher1(names[0] || '');
                    setFormTeacher2(names[1] || '');
                }
            }, [editingLesson]);

            const conflicts = useMemo(() => findAllConflicts(lessons), [lessons]);
            const conflictingLessonIds = useMemo(() => new Set(conflicts.flatMap(c => c.lessonIds)), [conflicts]);

            const teacherLessonCounts = useMemo(() => {
                const counts = {};
                lessons.forEach(l => {
                    (l.teacher || '').split(',').map(n => n.trim()).forEach(name => {
                        if (name) counts[name] = (counts[name] || 0) + 1;
                    });
                });
                return counts;
            }, [lessons]);

            const roomLessonCounts = useMemo(() => {
                const counts = {};
                lessons.forEach(l => {
                    if (l.room) counts[l.room] = (counts[l.room] || 0) + 1;
                });
                return counts;
            }, [lessons]);

            const filteredLessons = useMemo(() => {
                switch (viewMode) {
                    case 'Class': return lessons.filter(l => l.classId === viewFilter);
                    case 'Teacher': return lessons.filter(l => (l.teacher || '').split(',').map(n => n.trim()).includes(viewFilter));
                    case 'Room': return lessons.filter(l => l.room === viewFilter);
                    case 'Conflict': return lessons.filter(l => conflictingLessonIds.has(l.id));
                    default: return lessons;
                }
            }, [lessons, viewMode, viewFilter, conflictingLessonIds]);

            // 一鍵自動化解衝堂
            const handleAutoResolveConflicts = () => {
                const { resolvedLessons, resolvedCount, remainingConflicts } = resolveAllConflicts(lessons, assignments, rooms);
                setLessons(resolvedLessons);
                if (remainingConflicts.length === 0) {
                    showToast(resolvedCount > 0 ? `⚡ 成功自動化解 ${resolvedCount} 處衝堂！全校課表達成 100% 零衝突！` : '課表目前已處於最佳狀態，無任何衝堂。', 'success');
                } else {
                    showToast(`⚡ 已化解 ${resolvedCount} 處衝堂，剩餘 ${remainingConflicts.length} 處源自已鎖定課程相互重疊，建議解除鎖定後重試。`, 'info');
                }
            };

            const handleCleanDoublePeriods = () => {
                const cleaned = validateDoublePeriods(lessons);
                setLessons(cleaned);
                showToast('🔗 已重新校準並對齊連堂課程標記！', 'success');
            };

            // 學級升級邏輯：導師晉級後直接繼承新年級的導師配課包，科任老師配課維持不變
const handleAcademicYearUpgrade = () => {
    // 年級遞晉對照表（101 -> 201 -> 301 -> 401 -> 501 -> 601 -> 101 循環）
    const classMap = { 
        '101': '201', 
        '201': '301', 
        '301': '401', 
        '401': '501', 
        '501': '601', 
        '601': '101' 
    };

    // 1. 找出各班目前的原任導師（以配課中有「晨圈」者判定為該班導師）
    const classToTutor = {};
    const tutorToCurrentClass = {};
    Object.entries(assignments).forEach(([teacherName, tAssignments]) => {
        tAssignments.forEach(as => {
            if (as.subject === '晨圈') {
                classToTutor[as.classId] = teacherName;
                tutorToCurrentClass[teacherName] = as.classId;
            }
        });
    });

    // 2. 擷取各班原本既有的「導師配課包」模板（該導師在該班負責的所有配課）
    const classTutorPackage = {};
    Object.entries(classToTutor).forEach(([cls, tutorName]) => {
        const tAssignments = assignments[tutorName] || [];
        // 取出該班導師在自己帶的班級所配的所有課程
        classTutorPackage[cls] = tAssignments.filter(as => as.classId === cls);
    });

    // 3. 計算各導師升級後負責的新班級
    // 例如：原 201 導師 -> 新接 301 班
    const tutorToNextClass = {};
    Object.entries(tutorToCurrentClass).forEach(([teacherName, curClass]) => {
        tutorToNextClass[teacherName] = classMap[curClass];
    });

    // 4. 重構師資配課庫 (assignments)
    const nextAssignments = {};
    teachers.forEach(teacherName => {
        const curAssignments = assignments[teacherName] || [];
        const isTutor = Boolean(tutorToCurrentClass[teacherName]);

        if (isTutor) {
            const oldClass = tutorToCurrentClass[teacherName];
            const targetClass = tutorToNextClass[teacherName];

            // (A) 保留該導師若有其他非本班導師職責的個人兼課
            const nonHomeroomAssignments = curAssignments.filter(as => as.classId !== oldClass);

            // (B) 直接繼承目標年級「既有的導師配課包」
            const inheritedPackage = (classTutorPackage[targetClass] || []).map(as => ({
                ...as,
                classId: targetClass // 確保班級標記與目標年級一致
            }));

            nextAssignments[teacherName] = [...nonHomeroomAssignments, ...inheritedPackage];
        } else {
            // (C) 科任老師：配課與班級完全不變
            nextAssignments[teacherName] = JSON.parse(JSON.stringify(curAssignments));
        }
    });

    // 5. 更新課表排定清單 (lessons)：將各班導師授課項目交接給新任導師
    const nextLessons = lessons.map(l => {
        const lTeachers = (l.teacher || '').split(',').map(n => n.trim());
        const curClassTutor = classToTutor[l.classId]; // 該班原任導師

        // 若該節課由原任導師授課，則改由晉升接掌該班的新導師授課
        if (curClassTutor && lTeachers.includes(curClassTutor)) {
            let incomingTutor = '';
            Object.entries(classMap).forEach(([prevClass, nextClass]) => {
                if (nextClass === l.classId) {
                    incomingTutor = classToTutor[prevClass];
                }
            });

            if (incomingTutor) {
                const replaced = lTeachers.map(t => (t === curClassTutor ? incomingTutor : t)).join(', ');
                return { ...l, teacher: replaced };
            }
        }
        return l;
    });

    // 6. 寫回狀態並提示
    setAssignments(nextAssignments);
    setLessons(nextLessons);
    setIsUpgradeModalOpen(false);
    showToast('🎓 學級升級完成！導師已帶班晉級並直接繼承新年級導師配課，科任配課全數保留！', 'success');
};

            // 拖拉調課處理（含遮罩防護與成對連堂連動）
            const handleMoveLesson = (sourceId, targetDay, targetPeriodId, targetClassId) => {
                setLessons(prev => {
                    const srcIndex = prev.findIndex(l => l.id === sourceId);
                    if (srcIndex === -1) return prev;
                    const srcLesson = { ...prev[srcIndex] };
                    if (srcLesson.isLocked) return prev;

                    const finalClassId = targetClassId || srcLesson.classId;
                    const maskCheck = isClassSlotAvailable(finalClassId, targetDay, targetPeriodId);
                    if (!maskCheck.available) {
                        showToast(`無法移動：目標時段為【${maskCheck.reason}】，禁止排課！`, 'error');
                        return prev;
                    }

                    if (srcLesson.isDouble) {
                        const srcPartner = getDoublePeriodPartner(srcLesson.periodId);
                        const targetPartner = getDoublePeriodPartner(targetPeriodId);
                        if (!targetPartner) {
                            showToast('無法移動：連堂課程只能移動至成對時段（1-2節、3-4節、5-6節）！', 'info');
                            return prev;
                        }
                        const partnerMask = isClassSlotAvailable(finalClassId, targetDay, targetPartner);
                        if (!partnerMask.available) {
                            showToast(`無法移動：連堂配對的第 ${targetPartner} 節為【${partnerMask.reason}】！`, 'error');
                            return prev;
                        }
                        const pIdx = prev.findIndex(l => l.classId === srcLesson.classId && l.day === srcLesson.day && l.periodId === srcPartner && l.subject === srcLesson.subject);
                        const updated = [...prev];
                        updated[srcIndex] = { ...srcLesson, day: targetDay, periodId: targetPeriodId, classId: finalClassId };
                        if (pIdx !== -1 && !prev[pIdx].isLocked) {
                            updated[pIdx] = { ...prev[pIdx], day: targetDay, periodId: targetPartner, classId: finalClassId };
                        }
                        return updated;
                    }

                    const tgtIndex = prev.findIndex(l => l.day === targetDay && l.periodId === targetPeriodId && l.classId === finalClassId);
                    if (tgtIndex !== -1 && prev[tgtIndex].isLocked) return prev;

                    const updated = [...prev];
                    if (tgtIndex !== -1) {
                        const tgtLesson = { ...prev[tgtIndex] };
                        const sMask = isClassSlotAvailable(tgtLesson.classId, srcLesson.day, srcLesson.periodId);
                        if (!sMask.available) {
                            showToast(`無法交換：交換的時段對該班級為【${sMask.reason}】！`, 'error');
                            return prev;
                        }
                        updated[srcIndex] = { ...tgtLesson, day: srcLesson.day, periodId: srcLesson.periodId, classId: srcLesson.classId };
                        updated[tgtIndex] = { ...srcLesson, day: targetDay, periodId: targetPeriodId, classId: finalClassId };
                    } else {
                        updated[srcIndex] = { ...srcLesson, day: targetDay, periodId: targetPeriodId, classId: finalClassId };
                    }
                    return updated;
                });
            };

            const handleCellClick = (day, periodId, classId) => {
                const mask = isClassSlotAvailable(classId, day, periodId);
                if (!mask.available) {
                    showToast(`此時段為【${mask.reason}】，禁止排課！`, 'error');
                    return;
                }
                const existing = lessons.find(l => l.day === day && l.periodId === periodId && l.classId === classId);
                if (isStampMode && clipboard) {
                    if (existing && existing.isLocked) return;
                    const newLesson = { ...clipboard, id: Math.random().toString(36).substr(2, 9), day, periodId, classId, isLocked: false };
                    setLessons(prev => [...prev.filter(l => !(l.day === day && l.periodId === periodId && l.classId === classId)), newLesson]);
                } else {
                    if (existing && existing.isLocked) {
                        showToast('🔒 此課程已鎖定，請先解除鎖定再編輯。', 'info');
                        return;
                    }
                    setEditingLesson(existing ? { ...existing } : { day, periodId, classId, subject: '', teacher: '', room: '', color: COLOR_OPTIONS[0].value, isLocked: false, isDouble: false });
                    setIsEditing(true);
                }
            };

            const handleSaveLesson = () => {
                if (!editingLesson || !editingLesson.subject || !formTeacher1) return;
                const finalTeacher = [formTeacher1, formTeacher2].filter(Boolean).join(', ');
                const lessonToSave = { ...editingLesson, id: editingLesson.id || Math.random().toString(36).substr(2, 9), teacher: finalTeacher };
                
                if (lessonToSave.isDouble) {
                    const partnerPeriod = getDoublePeriodPartner(lessonToSave.periodId);
                    if (!partnerPeriod) {
                        showToast('此節次無法形成有效連堂（僅支援 1-2、3-4、5-6 節）！', 'info');
                        return;
                    }
                    const partnerLesson = { ...lessonToSave, id: Math.random().toString(36).substr(2, 9), periodId: partnerPeriod };
                    setLessons(prev => [
                        ...prev.filter(l => !(l.classId === lessonToSave.classId && l.day === lessonToSave.day && (l.periodId === lessonToSave.periodId || l.periodId === partnerPeriod))),
                        lessonToSave,
                        partnerLesson
                    ]);
                } else {
                    setLessons(prev => [
                        ...prev.filter(l => !(l.day === lessonToSave.day && l.periodId === lessonToSave.periodId && l.classId === lessonToSave.classId)),
                        lessonToSave
                    ]);
                }
                setIsEditing(false);
                setEditingLesson(null);
            };

            const handleDeleteLesson = () => {
                if (!editingLesson?.id) return;
                setLessons(prev => prev.filter(l => l.id !== editingLesson.id));
                setIsEditing(false);
                setEditingLesson(null);
            };

            // AI 自動排課連線 Gemini 官方 API
            const runAIScheduling = async () => {
                if (!aiPrompt.trim()) return;
                if (!geminiApiKey.trim()) {
                    showToast('請先點擊右上角「🔑 設定 API Key」輸入金鑰！', 'error');
                    setIsKeyModalOpen(true);
                    return;
                }

                setIsAILoading(true);
                try {
                    const lockedLessons = lessons.filter(l => l.isLocked);
                    
                    const promptText = `你是一位資深教務排課專家。請根據下列規則與資料為全校排課：
1. 班級列表：${JSON.stringify(CLASSES)}
2. 教師與配課需求（JSON）：${JSON.stringify(assignments)}
3. 必須保留之已鎖定課程（JSON）：${JSON.stringify(lockedLessons)}
4. 排課作息限制：
   - 星期三下午全校不排課（第5-7節禁排）
   - 全校第7節一律不排課
   - 101班每天下午放學（第5-7節禁排）
   - 201班週一、週三、週五下午放學（第5-7節禁排）
   - 連堂課程必須排在成對節次（1-2節、3-4節、5-6節）
   - 同一教師同一節次不得衝堂
5. 使用者偏好要求：${aiPrompt}

【重要輸出規定】：
請直接回傳純 JSON 陣列（Array），不要任何 Markdown 標記或文字說明。格式如下：
[
  {
    "id": "隨機字串",
    "classId": "101",
    "day": "Mon",
    "periodId": 1,
    "subject": "國語",
    "teacher": "王老師",
    "room": "",
    "color": "bg-blue-100 border-blue-200",
    "isDouble": false,
    "isLocked": false
  }
]`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    let responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    responseText = responseText.replace(/```json/gi, '').replace(/```/g, '').trim();

                    const newLessons = JSON.parse(responseText);
                    if (Array.isArray(newLessons)) {
                        const sanitized = newLessons.map(l => ({
                            ...l,
                            id: l.id || Math.random().toString(36).substr(2, 9),
                            periodId: Number(l.periodId),
                            day: DAYS.includes(l.day) ? l.day : 'Mon',
                            color: l.color || COLOR_OPTIONS[0].value,
                            isLocked: false,
                            isDouble: Boolean(l.isDouble)
                        })).filter(l => !isNaN(l.periodId) && CLASSES.includes(l.classId) && isClassSlotAvailable(l.classId, l.day, l.periodId).available);

                        const combined = [...lockedLessons, ...sanitized];
                        const { resolvedLessons, resolvedCount, remainingConflicts } = resolveAllConflicts(combined, assignments, rooms);

                        setLessons(resolvedLessons);
                        setIsAIModalOpen(false);
                        setAiPrompt('');
                        showToast(`✨ AI 自動排課成功！共排入 ${sanitized.length} 節課程（保留 ${lockedLessons.length} 節鎖定課程）。`, 'success');
                    } else {
                        throw new Error('AI 回傳格式非陣列格式');
                    }
                } catch (e) {
                    console.error(e);
                    showToast(`AI 運算失敗：${e.message || '請確認 API Key 是否有效'}`, 'error');
                } finally {
                    setIsAILoading(false);
                }
            };

            // 全校課表 Word 打包匯出
            const handleExportWord = () => {
                let html = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>均一學校課表</title>
                    <style>
                    body { font-family: "Microsoft JhengHei", "PMingLiU", serif; }
                    .page-container { margin: 20px; }
                    .header-title { font-size: 18pt; font-weight: bold; text-align: center; margin-bottom: 2pt; }
                    .header-subtitle { font-size: 12pt; text-align: center; margin-bottom: 10pt; }
                    .meta-table { width: 100%; border: none; margin-bottom: 5pt; }
                    .meta-cell { border: none; text-align: center; font-size: 11pt; }
                    .info-box { border: 1.5pt solid black; padding: 5pt; text-align: center; font-weight: bold; font-size: 12pt; width: 30%; }
                    table.main-table { border-collapse: collapse; width: 100%; border: 2pt solid black; table-layout: fixed; }
                    table.main-table th, table.main-table td { border: 1pt solid black; padding: 4pt; text-align: center; vertical-align: middle; word-wrap: break-word; }
                    .bg-gray { background-color: #f2f2f2; }
                    .period-col { width: 45pt; font-size: 10pt; }
                    .time-col { width: 85pt; font-size: 9pt; }
                    .day-col { font-size: 10pt; font-weight: bold; }
                    .homeroom-col { width: 75pt; font-size: 10pt; font-weight: bold; }
                    .lesson-subject { font-weight: bold; font-size: 11pt; display: block; margin-bottom: 2pt; }
                    .lesson-teacher { font-size: 9pt; color: #333; }
                    .lesson-room { font-size: 8pt; color: #777; font-style: italic; }
                    .merged-section { font-weight: bold; color: #333; letter-spacing: 2pt; font-size: 10.5pt; }
                    .subject-list-header { font-weight: bold; font-size: 11pt; border-bottom: 1pt solid #000; margin-bottom: 5pt; padding-bottom: 2pt; }
                    .subject-list-item { text-align: left; font-size: 9pt; margin-bottom: 2pt; }
                    .student-count-table { width: 100%; border: none; font-size: 8pt; }
                    .student-count-table td { border: none !important; padding: 1pt !important; }
                    .footer { text-align: right; font-size: 8pt; margin-top: 10pt; color: #999; }
                    .page-break { page-break-after: always; }
                    </style>
                </head>
                <body>`;

                const buildRows = (id, all, subjs, type) => {
                    const getCells = (periodId) => DAYS.map(day => {
                        const l = type === 'Class'
                            ? all.find(x => x.classId === id && x.day === day && x.periodId === periodId)
                            : all.find(x => (x.teacher || '').includes(id) && x.day === day && x.periodId === periodId);
                        if (l) return `<td><span class="lesson-subject">${l.subject}</span><span class="lesson-teacher">${type === 'Class' ? l.teacher : l.classId + ' 班'}</span>${l.room ? `<br><span class="lesson-room">📍${l.room}</span>` : ''}</td>`;
                        return '<td></td>';
                    }).join('');

                    let rows = `<tr><td class="period-col bg-gray">晨間</td><td class="time-col bg-gray">07:50-08:00</td><td colspan="5" class="merged-section">晨間彈性時間 Quiet Time</td><td></td></tr>`;
                    rows += `<tr><td class="period-col bg-gray">1</td><td class="time-col bg-gray">08:00-09:00</td>${getCells(1)}<td rowspan="2" style="vertical-align: top; padding: 5pt;">${type === 'Class' ? '<div style="font-weight:bold; font-size: 9pt; margin-bottom: 5pt;">學生人數<br><span style="font-size:8pt">Total of Students</span></div><table class="student-count-table"><tr><td>女生<br>Girls</td><td>男生<br>Boys</td></tr><tr><td style="border-bottom: 1pt solid #ccc !important;">&nbsp;</td><td style="border-bottom: 1pt solid #ccc !important;">&nbsp;</td></tr><tr><td colspan="2" style="text-align: right; padding-top: 5pt !important; font-size: 10pt;">人</td></tr></table>' : ''}</td></tr>`;
                    rows += `<tr><td class="period-col bg-gray">2</td><td class="time-col bg-gray">09:00-10:00</td>${getCells(2)}</tr>`;
                    rows += `<tr><td class="period-col bg-gray">大下課</td><td class="time-col bg-gray">10:00-10:30</td><td colspan="5" class="merged-section">下課時間 Recess</td><td rowspan="8" style="vertical-align: top; padding: 8pt; text-align: left;"><div class="subject-list-header">授課科目<br>Subjects</div>${subjs.map(s => `<div class="subject-list-item">▪ ${s}</div>`).join('')}</td></tr>`;

                                        className: 'w-5 h-5 text-amber-600 rounded'
                                    }),
                                    h('div', null, [
                                        h('span', { className: 'text-sm font-black text-amber-950 block' }, '🔒 鎖定此課程（排課與消除衝堂時絕不移動）'),
                                        h('span', { className: 'text-[11px] text-amber-700 font-bold block mt-0.5' }, '若取消勾選，演算法將可在「一鍵自動消除衝堂」時調動此課程以避開衝堂')
                                    ])
                                ])
                            ]),
                            h('div', { className: 'flex gap-4 pt-4' }, [
                                editingLesson?.id && h('button', { onClick: handleDeleteLesson, className: 'flex-1 py-4 bg-red-50 text-red-600 rounded-2xl font-black' }, '刪除'),
                                h('button', { onClick: handleSaveLesson, className: 'flex-[2] py-4 bg-indigo-600 text-white rounded-2xl font-black' }, '儲存變更')
                            ])
                        ])
                    ])
                ]),

                // 隱藏的檔案匯入 input
                h('input', {
                    type: 'file',
                    ref: fileInputRef,
                    accept: '.json',
                    className: 'hidden',
                    onChange: (e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const data = JSON.parse(event.target.result);
                                if (data.teachers) setTeachers(data.teachers);
                                if (data.rooms) setRooms(data.rooms);
                                if (data.lessons) setLessons(data.lessons);
                                if (data.assignments) setAssignments(data.assignments);
                                showToast('📥 課表資料匯入成功！', 'success');
                            } catch (err) {
                                showToast('匯入失敗，請確認檔案格式是否正確。', 'error');
                            }
                        };
                        reader.readAsText(file);
                        e.target.value = '';
                    }
                })
            ]);
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
